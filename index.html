<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelX | Professional Web3 MLM</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body { background-color:#060b14; scroll-behavior:smooth; }
.glass { background:rgba(13,19,32,0.95); border:1px solid rgba(255,255,255,0.05); }
#sidebar { transition:transform .3s ease-in-out; }
@media(max-width:1024px){ .sidebar-folded{ transform:translateX(-100%);} }
</style>
</head>

<body class="text-white font-sans">

<div class="min-h-screen flex flex-col lg:flex-row">

<!-- SIDEBAR -->
<aside id="sidebar" class="sidebar-folded w-72 bg-[#0d1320] p-6 fixed lg:sticky h-screen">
<h1 class="text-3xl font-black text-emerald-400 mb-8">TRAVELX</h1>

<nav class="space-y-3 text-sm font-bold">
<a class="block px-4 py-3 bg-emerald-400 text-black rounded-2xl">Dashboard</a>
<a class="block px-4 py-3 bg-white/5 rounded-2xl">Buy & Swap</a>
<a class="block px-4 py-3 bg-white/5 rounded-2xl">VIP Rewards</a>
<a class="block px-4 py-3 bg-white/5 rounded-2xl">Reports</a>
</nav>

<p class="mt-auto text-yellow-400 font-black" id="sideRank">NONE</p>
</aside>

<!-- MAIN -->
<main class="flex-1 p-6">

<!-- TOP -->
<div class="flex justify-between mb-6">
<h2 class="text-3xl font-black">Investor Portal</h2>

<div class="flex gap-2 items-center">
<button id="connectBtn" onclick="connect()" class="bg-emerald-400 text-black px-4 py-2 rounded-xl font-black">Connect</button>
<div id="walletDisplay" class="hidden glass px-3 py-1 text-xs"></div>
</div>
</div>

<!-- REF LINK -->
<div id="refBox" class="hidden glass p-3 mb-4 flex justify-between items-center rounded-xl">
<span id="refLink" class="text-xs"></span>
<button onclick="copyRef()" class="bg-emerald-400 text-black px-3 py-1 text-xs font-black rounded">COPY</button>
</div>

<!-- STATS -->
<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
<div class="glass p-4">BNB <h3 id="bnbBal">0</h3></div>
<div class="glass p-4">TVX <h3 id="tvxBal">0</h3></div>
<div class="glass p-4">Reward <h3 id="stakeProfit">0</h3></div>
<div class="glass p-4">Income <h3 id="income">0</h3></div>
</div>

<!-- TEAM -->
<div class="glass p-5 mb-6">
<h3 class="text-emerald-400 font-black mb-3">👥 Referral Team</h3>

<div class="grid grid-cols-3 text-center text-xs">
<div>Direct <p id="directCount" class="text-xl font-black">0</p></div>
<div>Total <p id="teamCount" class="text-xl font-black text-yellow-400">0</p></div>
<div>Active <p id="activeCount" class="text-xl font-black text-blue-400">0</p></div>
</div>
</div>

<!-- BUY -->
<div class="glass p-4 mb-4">
<input id="bnbInput" type="number" class="w-full p-3 bg-black/40 rounded" placeholder="BNB">
<button onclick="buy()" class="w-full bg-yellow-400 text-black font-black mt-3 py-3">BUY</button>
</div>

<!-- SWAP -->
<div class="glass p-4 mb-4">
<input id="swapInput" type="number" class="w-full p-3 bg-black/40 rounded" placeholder="TVX">
<button onclick="internalSwap()" class="w-full bg-white text-black font-black mt-3 py-3">SWAP</button>
</div>

<!-- ACTIVATE -->
<div class="glass p-5 mb-4 flex justify-between items-center">
<p>Stake 10,000 TVX</p>
<button id="activateBtn" onclick="activate()" class="bg-emerald-400 text-black px-4 py-2 font-black rounded">ACTIVATE</button>
</div>

<!-- REPORT -->
<div class="glass p-4 mb-4">
<h3 class="text-emerald-400 font-black mb-3">History</h3>
<table class="text-xs w-full">
<tbody id="txList"></tbody>
</table>
</div>

<!-- WITHDRAW -->
<div class="glass p-5 flex justify-between">
<h1 id="balDisplay">$0</h1>
<button onclick="withdraw()" class="bg-white text-black px-4 py-2 font-black">WITHDRAW</button>
</div>

</main>
</div>

<script>

const RATE=10000, TVX_USD=0.01;
let account, provider, signer;

const db=()=>JSON.parse(localStorage.getItem("tvx"))||{};
const save=d=>localStorage.setItem("tvx",JSON.stringify(d));

function toggleSidebar(){
document.getElementById("sidebar").classList.toggle("sidebar-folded");
}

function getRef(){
return `${location.origin}?ref=${account}`;
}

function copyRef(){
navigator.clipboard.writeText(getRef());
Swal.fire("Copied!");
}

async function connect(){
const acc=await ethereum.request({method:"eth_requestAccounts"});
account=acc[0].toLowerCase();

let d=db();
if(!d[account]){
let ref=new URLSearchParams(location.search).get("ref");
d[account]={sponsor:ref||null,directs:[],tvx:0,bnb:0,active:false,tx:[]};
if(ref&&d[ref]) d[ref].directs.push(account);
save(d);
}

document.getElementById("walletDisplay").classList.remove("hidden");
document.getElementById("walletDisplay").innerText=account.slice(0,6)+"...";
document.getElementById("connectBtn").style.display="none";

document.getElementById("refBox").classList.remove("hidden");
document.getElementById("refLink").innerText=getRef();

update();
setInterval(update,5000);
}

function update(){

let d=db();
let u=d[account]; if(!u)return;

document.getElementById("bnbBal").innerText=u.bnb;
document.getElementById("tvxBal").innerText=u.tvx;
document.getElementById("income").innerText=u.bnb;

document.getElementById("directCount").innerText=u.directs.length;

let total=0,active=0;
function count(x){
if(!d[x])return;
total++;
if(d[x].active)active++;
d[x].directs.forEach(count);
}
u.directs.forEach(count);

document.getElementById("teamCount").innerText=total;
document.getElementById("activeCount").innerText=active;

document.getElementById("txList").innerHTML=
(u.tx||[]).map(t=>`<tr><td>${t}</td></tr>`).join("");

}

function buy(){
let amt=+bnbInput.value;
let d=db();
d[account].tvx+=amt*RATE;
save(d);
update();
}

function internalSwap(){
let amt=+swapInput.value;
let d=db();
if(d[account].tvx<amt)return;

d[account].tvx-=amt;
d[account].bnb+=(amt*TVX_USD);
save(d);
update();
}

function activate(){
let d=db();
if(d[account].tvx<10000)return;

d[account].tvx-=10000;
d[account].active=true;
save(d);
update();
}

function withdraw(){
let d=db();
d[account].bnb=0;
save(d);
update();
}

</script>

</body>
</html>
