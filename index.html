<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TravelX</title>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>

:root{
    --primary:#00ff99;
    --bg:#0b0f19;
    --card:#111827;
    --text:#ffffff;
    --text-dim:#9ca3af;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:360px;
    background:var(--card);
    border-radius:20px;
    padding:25px;
    text-align:center;
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

.logo{
    width:70px;
    height:70px;
    border-radius:50%;
    background:linear-gradient(45deg,#00ff99,#00bfff);
    display:flex;
    justify-content:center;
    align-items:center;
    margin:auto;
    font-size:28px;
    font-weight:bold;
    margin-bottom:15px;
}

h1{
    color:var(--primary);
    margin-bottom:8px;
}

.subtitle{
    color:var(--text-dim);
    margin-bottom:25px;
    font-size:14px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--primary);
    color:#000;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
    transition:0.3s;
}

button:hover{
    opacity:0.9;
}

.dashboard{
    width:100%;
    max-width:500px;
}

.top-box{
    background:var(--card);
    border-radius:18px;
    padding:18px;
    margin-bottom:15px;
}

.label{
    color:var(--text-dim);
    font-size:13px;
}

.wallet{
    margin-top:6px;
    font-size:18px;
    color:var(--primary);
    font-weight:bold;
}

.section-title{
    margin-bottom:10px;
    font-size:16px;
}

.tx-box{
    background:#0d1117;
    padding:12px;
    border-radius:12px;
    margin-bottom:10px;
    border-left:3px solid var(--primary);
    font-size:12px;
}

.tx-row{
    display:flex;
    justify-content:space-between;
}

.tx-date{
    margin-top:5px;
    color:var(--text-dim);
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#0d1117;
    color:#fff;
    margin-top:10px;
}

a{
    color:#00bfff;
    text-decoration:none;
}

</style>
</head>

<body>

<!-- CONNECT PAGE -->
<div id="connectPage" class="card">

    <div class="logo">T</div>

    <h1>TravelX</h1>

    <div class="subtitle">
        Decentralized Staking Ecosystem
    </div>

    <button onclick="connectWallet()">
        Connect Web3 Wallet
    </button>

</div>

<!-- DASHBOARD -->
<div id="dashboardPage" class="dashboard" style="display:none;">

    <div class="top-box">

        <div class="label">
            Connected Wallet
        </div>

        <div class="wallet" id="walletAddress">
            0x0000
        </div>

    </div>

    <div class="top-box">

        <div class="section-title">
            Referral Link
        </div>

        <input type="text" id="refLink" readonly>

        <button onclick="copyRef()">
            Copy Referral
        </button>

    </div>

    <div class="top-box">

        <div class="section-title">
            Transaction History
        </div>

        <div id="txHistoryList"></div>

    </div>

</div>

<script>

let currentAccount = null;

// CONNECT WALLET
async function connectWallet(){

    try{

        if(!window.ethereum){

            Swal.fire({
                title:'MetaMask Not Found',
                text:'Please install MetaMask wallet',
                icon:'warning'
            });

            return;
        }

        const accounts = await window.ethereum.request({
            method:'eth_requestAccounts'
        });

        currentAccount = accounts[0];

        localStorage.setItem(
            'travelx_wallet',
            currentAccount
        );

        document.getElementById('walletAddress').innerHTML =
            currentAccount.slice(0,6) +
            "..." +
            currentAccount.slice(-4);

        // HIDE LOGIN
        document.getElementById('connectPage').style.display = 'none';

        // SHOW DASHBOARD
        document.getElementById('dashboardPage').style.display = 'block';

        setupReferral();

        renderHistory();

        // DEMO TX
        saveTx(
            "Wallet Connected",
            "0 BNB",
            "demo_hash_" + Date.now()
        );

        Swal.fire({
            title:'Wallet Connected',
            icon:'success',
            timer:1200,
            showConfirmButton:false
        });

    }catch(err){

        console.log(err);

        Swal.fire({
            title:'Connection Failed',
            text:err.message,
            icon:'error'
        });
    }
}

// AUTO LOGIN
window.addEventListener('load',()=>{

    const saved =
        localStorage.getItem('travelx_wallet');

    if(saved){

        currentAccount = saved;

        document.getElementById('connectPage').style.display='none';

        document.getElementById('dashboardPage').style.display='block';

        document.getElementById('walletAddress').innerHTML =
            currentAccount.slice(0,6) +
            "..." +
            currentAccount.slice(-4);

        setupReferral();

        renderHistory();
    }
});

// SAVE TX
function saveTx(type, amount, hash){

    let history = JSON.parse(
        localStorage.getItem(
            'travelx_tx_' + currentAccount
        )
    ) || [];

    history.unshift({
        type,
        amount,
        hash,
        date:new Date().toLocaleDateString()
    });

    localStorage.setItem(
        'travelx_tx_' + currentAccount,
        JSON.stringify(history.slice(0,8))
    );

    renderHistory();
}

// RENDER TX
function renderHistory(){

    const list =
        document.getElementById('txHistoryList');

    let history = JSON.parse(
        localStorage.getItem(
            'travelx_tx_' + currentAccount
        )
    ) || [];

    if(history.length === 0){

        list.innerHTML = `
            <div style="color:gray;text-align:center;padding:10px;">
                No Transaction Found
            </div>
        `;

        return;
    }

    list.innerHTML = history.map(tx => `

        <div class="tx-box">

            <div class="tx-row">
                <b>${tx.type}</b>
                <span>${tx.amount}</span>
            </div>

            <div class="tx-row tx-date">

                <span>${tx.date}</span>

                <a href="https://bscscan.com/tx/${tx.hash}"
                   target="_blank">
                   View Scan
                </a>

            </div>

        </div>

    `).join('');
}

// REFERRAL
function setupReferral(){

    document.getElementById('refLink').value =
        window.location.origin +
        window.location.pathname +
        '?ref=' + currentAccount;
}

// COPY REF
function copyRef(){

    navigator.clipboard.writeText(
        document.getElementById('refLink').value
    );

    Swal.fire({
        title:'Copied!',
        icon:'success',
        timer:1000,
        showConfirmButton:false
    });
}

// ACCOUNT CHANGE
if(window.ethereum){

    window.ethereum.on(
        'accountsChanged',
        function(accounts){

            if(accounts.length > 0){

                currentAccount = accounts[0];

                localStorage.setItem(
                    'travelx_wallet',
                    currentAccount
                );

                document.getElementById('walletAddress').innerHTML =
                    currentAccount.slice(0,6) +
                    "..." +
                    currentAccount.slice(-4);

                setupReferral();

                renderHistory();

            }else{

                localStorage.removeItem(
                    'travelx_wallet'
                );

                location.reload();
            }
        }
    );
}

</script>

</body>
</html>
