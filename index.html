<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelX Dashboard</title>

    <!-- LIBRARIES -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { background:#060b14; }
        .glass { background:rgba(13,19,32,.95); border:1px solid rgba(255,255,255,.05); }
        #sidebar { transition:.3s ease; z-index:100; }
        @media(max-width:1024px){
            .sidebar-folded { transform:translateX(-100%); }
        }
    </style>
</head>

<body class="text-white overflow-x-hidden">

<div class="min-h-screen flex">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="w-72 bg-[#0d1320] p-6 fixed lg:sticky h-screen flex flex-col sidebar-folded lg:transform-none">
        <div class="flex justify-between items-center">
            <h1 class="text-3xl font-black text-emerald-400">TRAVELX</h1>
            <button onclick="toggleSidebar()" class="lg:hidden text-2xl text-white">×</button>
        </div>

        <nav class="mt-10 flex-1 space-y-3">
            <a class="block bg-emerald-400 text-black p-3 rounded-xl text-center font-bold">Dashboard</a>
            <a href="#rewards" class="block bg-white/5 p-3 rounded-xl text-center">VIP Rewards</a>
        </nav>

        <div class="text-center border-t border-white/10 pt-4">
            <p class="text-yellow-400">Rank Status</p>
            <p id="sideRank" class="text-xl font-black">NONE</p>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 p-6 lg:p-10 w-full">

        <!-- TOP BAR -->
        <div class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="lg:hidden p-2 bg-white/10 rounded-lg">☰</button>
                <div>
                    <h2 class="text-2xl lg:text-3xl font-black uppercase">Investor Portal</h2>
                    <p class="text-gray-400 text-xs">Earn 18% APY & Global Rewards</p>
                </div>
            </div>

            <div class="flex gap-3">
                <button id="connectBtn" onclick="connect()" class="bg-emerald-400 text-black px-5 py-2 rounded-xl font-bold">Connect</button>
                <div id="walletDisplay" class="hidden glass px-4 py-2 rounded-xl text-emerald-400 text-xs font-mono border border-emerald-400/20">0x...</div>
            </div>
        </div>

        <!-- STATS GRID -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-10 text-center">
            <div class="glass p-5 rounded-2xl">
                <p class="text-gray-500 text-[10px] uppercase font-bold">BNB Balance</p>
                <h3 id="bnbBal" class="text-xl font-black mt-1">0.0000</h3>
            </div>
            <div class="glass p-5 rounded-2xl">
                <p class="text-gray-500 text-[10px] uppercase font-bold">TVX Assets</p>
                <h3 id="tvxBal" class="text-xl font-black mt-1 text-emerald-400">0</h3>
            </div>
            <div class="glass p-5 rounded-2xl border border-yellow-500/20">
                <p class="text-yellow-500 text-[10px] uppercase font-bold">Stake Reward</p>
                <h3 id="stakeProfit" class="text-xl font-black mt-1 text-yellow-500">0.00</h3>
            </div>
            <div class="glass p-5 rounded-2xl border border-blue-500/20">
                <p class="text-blue-400 text-[10px] uppercase font-bold">MLM Income</p>
                <h3 id="income" class="text-xl font-black mt-1 text-blue-400">0.00</h3>
            </div>
        </div>

        <!-- REFERRAL SECTION -->
        <div class="glass p-6 lg:p-8 rounded-[30px] border border-emerald-400/10">
            <h3 class="text-xl font-black text-emerald-400 uppercase">Invite & Earn</h3>
            <p class="text-gray-400 text-xs mt-1 mb-6">CONNECT WALLET TO GENERATE YOUR LINK</p>
            
            <div class="flex flex-col sm:flex-row gap-3">
                <input id="refLink" readonly type="text" placeholder="Wallet Not Connected" 
                    class="flex-1 bg-black/40 border border-white/10 rounded-xl px-4 py-4 text-xs font-mono text-emerald-400 outline-none">
                <button onclick="copyRef()" class="bg-emerald-400 text-black px-10 py-4 rounded-xl font-bold uppercase hover:bg-emerald-500 transition-all">Copy Link</button>
            </div>
        </div>

    </main>
</div>

<script>
let provider, address;

function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("sidebar-folded");
}

async function connect() {
    if (typeof window.ethereum !== 'undefined') {
        try {
            const accounts = await ethereum.request({ method: 'eth_requestAccounts' });
            address = accounts[0];
            provider = new ethers.providers.Web3Provider(window.ethereum);

            updateUI();
            
            Swal.fire({
                icon: 'success',
                title: 'Connected!',
                text: 'Wallet: ' + address.slice(0,6) + "..." + address.slice(-4),
                background: '#0d1320',
                color: '#fff',
                confirmButtonColor: '#10b981'
            });
        } catch (err) {
            console.error(err);
        }
    } else {
        Swal.fire('Error', 'Please install MetaMask!', 'error');
    }
}

async function updateUI() {
    if (!address) return;

    // Balance update
    const balance = await provider.getBalance(address);
    document.getElementById('bnbBal').innerText = parseFloat(ethers.utils.formatEther(balance)).toFixed(4);

    // Display updates
    document.getElementById('walletDisplay').innerText = address.slice(0,6) + "..." + address.slice(-4);
    document.getElementById('walletDisplay').classList.remove('hidden');
    document.getElementById('connectBtn').classList.add('hidden');

    // Referral link generation
    const currentUrl = window.location.origin + window.location.pathname;
    document.getElementById('refLink').value = currentUrl + "?ref=" + address;
}

function copyRef() {
    const copyText = document.getElementById("refLink");
    if (!address) {
        Swal.fire('Warning', 'Connect your wallet first!', 'warning');
        return;
    }
    
    navigator.clipboard.writeText(copyText.value).then(() => {
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: 'success',
            title: 'Link Copied!',
            showConfirmButton: false,
            timer: 1500,
            background: '#0d1320',
            color: '#fff'
        });
    });
}
</script>

</body>
</html>
