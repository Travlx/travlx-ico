<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelX | Secure ICO Portal</title>
<script src="https://ethers.io"></script>
<script src="https://jsdelivr.net"></script>
<style>
    :root{ --primary:#00ff99; --bg:#0b0f19; --card:#111827; --text:#ffffff; --text-dim:#9ca3af; }
    *{ margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Arial, sans-serif; }
    body{ background:var(--bg); color:var(--text); min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; }
    .dashboard { width:100%; max-width:400px; background:var(--card); border-radius:24px; padding:30px; text-align:center; border:1px solid rgba(255,255,255,0.08); box-shadow:0 20px 50px rgba(0,0,0,0.5); }
    .top-box{ background:rgba(255,255,255,0.03); border-radius:18px; padding:18px; margin-bottom:15px; text-align:left; border:1px solid rgba(255,255,255,0.05); }
    .label{ color:var(--text-dim); font-size:11px; text-transform: uppercase; font-weight: bold; }
    button{ width:100%; padding:14px; border:none; border-radius:14px; background:var(--primary); color:#000; font-weight:bold; cursor:pointer; margin-top:10px; transition:0.3s; }
    input{ width:100%; padding:14px; border:none; border-radius:12px; background:#0d1117; color:#fff; margin-top:10px; outline:none; border: 1px solid #1f2937; }
</style>
</head>
<body>

<div id="dashboardPage" class="dashboard">
    <div class="top-box">
        <span class="label">Connected Wallet</span>
        <div id="walletAddress" style="color:var(--primary); font-family:monospace; margin-top:5px; font-size:15px;">0x...</div>
    </div>

    <div style="display:flex; gap:12px; margin-bottom:15px;">
        <div class="top-box" style="flex:1; margin-bottom:0;">
            <span class="label">BNB Balance</span>
            <div id="bnbBalance" style="font-weight:bold; font-size:18px;">0.0000</div>
        </div>
        <div class="top-box" style="flex:1; margin-bottom:0;">
            <span class="label">TRVX Asset</span>
            <div id="trvxBalance" style="color:var(--primary); font-weight:bold; font-size:18px;">0.00</div>
        </div>
    </div>

    <div class="top-box" style="border: 1px solid rgba(0,255,153,0.3);">
        <span class="label">Purchase TRVX (1 BNB = 10,000)</span>
        <input type="number" id="bnbInput" oninput="liveCalc()" step="0.001" min="0.001" placeholder="Amount in BNB">
        <p style="margin-top: 10px; font-size: 13px; color: #9ca3af;">
            Estimated Receive: <span id="tokenPreview" style="color:var(--primary); font-weight:bold;">0</span> TRVX
        </p>
        <button id="buyBtn" onclick="buyTokens()" style="background: linear-gradient(90deg, #00ff99, #00bfff); color:#000;">Confirm Purchase</button>
    </div>

    <div class="top-box">
        <span class="label">Your Referral Link</span>
        <input type="text" id="refLink" readonly style="font-size:10px; background:#0b0f19;">
        <button onclick="copyRef()" style="background:#374151; color:white;">Copy Link</button>
    </div>
</div>

<audio id="successSound" src="https://mixkit.co"></audio>

<script>
let currentAccount = null;
let provider, signer;

// --- CONFIGURATION (অ্যাড্রেসগুলো সঠিক আছে কি না চেক করুন) ---
const masterAddress = "YOUR_MASTER_CONTRACT_ADDRESS";
const tokenAddress = "YOUR_TOKEN_CONTRACT_ADDRESS";
const rate = 10000;

function liveCalc() {
    const val = document.getElementById('bnbInput').value;
    document.getElementById('tokenPreview').innerText = val > 0 ? (val * rate).toLocaleString() : 0;
}

async function connect() {
    if (window.ethereum) {
        try {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            currentAccount = accounts[0];
            provider = new ethers.providers.Web3Provider(window.ethereum);
            signer = provider.getSigner();
            
            updateUI();
            setInterval(updateUI, 10000);
            
            window.ethereum.on('accountsChanged', () => location.reload());
            window.ethereum.on('chainChanged', () => location.reload());
        } catch (e) { console.error("Connection error"); }
    } else { Swal.fire('Error', 'MetaMask not found!', 'warning'); }
}

async function updateUI() {
    if (!currentAccount) return;
    try {
        const bal = await provider.getBalance(currentAccount);
        document.getElementById('bnbBalance').innerText = parseFloat(ethers.utils.formatEther(bal)).toFixed(4);
        document.getElementById('walletAddress').innerText = currentAccount.slice(0,6) + "..." + currentAccount.slice(-4);
        
        // টোকেন ব্যালেন্স আপডেট
        const tCon = new ethers.Contract(tokenAddress, ["function balanceOf(address) view returns (uint256)"], provider);
        const tBal = await tCon.balanceOf(currentAccount);
        document.getElementById('trvxBalance').innerText = parseFloat(ethers.utils.formatUnits(tBal, 18)).toLocaleString();

        document.getElementById('refLink').value = window.location.origin + window.location.pathname + '?ref=' + currentAccount;
    } catch (e) { console.error("Update failed"); }
}

async function buyTokens() {
    const amt = document.getElementById('bnbInput').value;
    if (!amt || amt <= 0) return Swal.fire('Error', 'Enter a valid amount', 'warning');

    try {
        // ১. ব্যালেন্স চেক (মিছ ফায়ার রোধে)
        const userBal = await provider.getBalance(currentAccount);
        const cost = ethers.utils.parseEther(amt.toString());
        if (userBal.lt(cost)) return Swal.fire('Insufficient Fund', 'আপনার ওয়ালেটে পর্যাপ্ত BNB নেই', 'error');

        // ২. রেফারার ভ্যালিডেশন
        let ref = new URLSearchParams(window.location.search).get('ref');
        if (!ref || !ethers.utils.isAddress(ref)) ref = "0x0000000000000000000000000000000000000000";

        Swal.fire({ title: 'Processing...', text: 'মেটামাস্কে কনফার্ম করুন', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        const mCon = new ethers.Contract(masterAddress, ["function buyTokens(address _ref) payable"], signer);
        
        // ৩. ম্যানুয়াল গ্যাস লিমিট যোগ (নিখুঁত হওয়ার জন্য)
        const tx = await mCon.buyTokens(ref, {
            value: cost,
            gasLimit: 150000 // স্ট্যান্ডার্ড গ্যাস লিমিট
        });

        await tx.wait();
        document.getElementById('successSound').play();
        Swal.fire('Success', 'টোকেন কেনা সফল হয়েছে!', 'success');
        updateUI();
        document.getElementById('bnbInput').value = "";
        document.getElementById('tokenPreview').innerText = "0";
    } catch (err) {
        console.error(err);
        Swal.fire('Failed', 'ট্রানজেকশনটি সম্পন্ন করা যায়নি', 'error');
    }
}

function copyRef() {
    navigator.clipboard.writeText(document.getElementById('refLink').value);
    Swal.fire({ title: 'Copied!', icon: 'success', timer: 1000, showConfirmButton: false });
}

window.addEventListener('load', connect);
</script>
</body>
</html>
