<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelX | Professional Web3 MLM</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { background-color: #060b14; scroll-behavior: smooth; }
        .glass { background: rgba(13, 19, 32, 0.95); border: 1px solid rgba(255,255,255,0.05); }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
        #sidebar { transition: transform 0.3s ease-in-out; }
        @media (max-width: 1024px) { .sidebar-folded { transform: translateX(-100%); } }
    </style>
</head>

<body class="text-white font-sans custom-scrollbar overflow-x-hidden">

<div class="min-h-screen flex flex-col lg:flex-row relative">

<!-- SIDEBAR (unchanged) -->
<aside id="sidebar" class="sidebar-folded w-full lg:w-72 bg-[#0d1320] border-r border-white/10 p-6 fixed lg:sticky top-0 h-screen z-[99] flex flex-col">
    <h1 class="text-3xl font-black text-emerald-400 mb-10 italic">TRAVELX</h1>
</aside>

<!-- MAIN -->
<main class="flex-1 p-4 lg:p-10 w-full">

    <!-- TOP -->
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-3xl font-black">Dashboard</h2>

        <button id="connectBtn" onclick="connect()"
            class="bg-emerald-400 text-black px-6 py-3 rounded-xl font-black">
            Connect
        </button>
    </div>

    <!-- 🔥 REFERRAL SYSTEM (ADDED) -->
    <div class="glass p-5 rounded-2xl mb-6 border border-emerald-400/20">
        <p class="text-xs text-gray-400 uppercase font-bold">Referral Link</p>

        <div class="flex gap-2 mt-3">
            <input id="refLink" readonly
                class="w-full p-3 bg-black/40 rounded-xl text-emerald-400 font-mono text-xs"
                placeholder="Connect wallet to generate link" />

            <button onclick="copyRef()"
                class="bg-emerald-400 text-black px-4 rounded-xl font-bold text-xs">
                COPY
            </button>
        </div>
    </div>

</main>
</div>

<script>

let account, provider, signer;

const db = () => JSON.parse(localStorage.getItem("tvx_db")) || {};
const save = d => localStorage.setItem("tvx_db", JSON.stringify(d));

/* =========================
   CONNECT WALLET
========================= */
async function connect() {
    if (!window.ethereum) return Swal.fire("Error", "MetaMask Required", "error");

    const accs = await window.ethereum.request({ method: "eth_requestAccounts" });
    account = accs[0].toLowerCase();

    provider = new ethers.providers.Web3Provider(window.ethereum);
    signer = provider.getSigner();

    let d = db();

    if (!d[account]) {
        let ref = new URLSearchParams(location.search).get("ref");

        d[account] = {
            sponsor: (ref && d[ref.toLowerCase()]) ? ref.toLowerCase() : null,
            directs: [],
            tvx: 0,
            bnb: 0,
            txHistory: []
        };

        if (ref && d[ref.toLowerCase()]) {
            d[ref.toLowerCase()].directs.push(account);
        }

        save(d);
    }

    document.getElementById("connectBtn").innerText = account.slice(0,6)+"..."+account.slice
