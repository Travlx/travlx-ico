<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelX | Full VIP Investor Portal</title>

<!-- FIXED CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body { background-color: #060b14; scroll-behavior: smooth; }
.glass { background: rgba(13, 19, 32, 0.95); border: 1px solid rgba(255,255,255,0.05); }
.custom-scrollbar::-webkit-scrollbar { width: 5px; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
#sidebar { transition: transform 0.3s ease-in-out; }
@media (max-width: 1024px) { .sidebar-folded { transform: translateX(-100%); } }
input[type=number] { -webkit-appearance: none; margin: 0; }
</style>
</head>

<body class="text-white font-sans custom-scrollbar overflow-x-hidden">

<div class="min-h-screen flex flex-col lg:flex-row relative">

<!-- MOBILE BAR -->
<div class="lg:hidden flex justify-between items-center bg-[#0d1320] p-5 border-b border-white/10 sticky top-0 z-[100]">
<h1 class="text-2xl font-black text-emerald-400 italic">TRAVELX</h1>

<button onclick="toggleSidebar()" class="p-2 bg-emerald-400/10 rounded-lg text-emerald-400">
<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/>
</svg>
</button>
</div>

<!-- SIDEBAR -->
<aside id="sidebar" class="sidebar-folded w-full lg:w-72 bg-[#0d1320] border-r border-white/10 p-6 fixed lg:sticky top-0 h-screen z-[99] flex flex-col">

<h1 class="text-3xl font-black text-emerald-400 mb-10 italic">TRAVELX</h1>

<nav class="space-y-3 flex-1 overflow-y-auto custom-scrollbar">
<a href="#" onclick="toggleSidebar()" class="block px-4 py-3 rounded-2xl bg-emerald-400 text-black font-bold">Dashboard</a>
<a href="#rewards" onclick="toggleSidebar()" class="block px-4 py-3 rounded-2xl bg-white/5">VIP Rewards</a>
<a href="#buySection" onclick="toggleSidebar()" class="block px-4 py-3 rounded-2xl bg-white/5">Buy & Swap</a>

<div class="mt-8 p-4 glass rounded-2xl">
<p class="text-[9px] text-gray-500 font-bold uppercase mb-2">Invite Friends</p>
<div class="flex items-center bg-black/40 rounded-xl p-2">
<input id="refInput" readonly value="Connect Wallet" class="bg-transparent flex-1 text-[10px] text-emerald-400 outline-none">
<button onclick="copyRef()" class="bg-emerald-400 text-black px-2 py-1 rounded-lg text-[9px]">Copy</button>
</div>
</div>
</nav>

</aside>

<!-- MAIN -->
<main class="flex-1 p-4 lg:p-10 w-full">

<div class="flex justify-between mb-8">
<div>
<h2 class="text-3xl font-black italic">Investor Portal</h2>
<p class="text-gray-500 text-sm">Passive Income & Referrals</p>
</div>

<button id="connectBtn" onclick="connect()" class="bg-emerald-400 text-black px-8 py-3 rounded-2xl font-black">Connect Wallet</button>

<div id="walletDisplay" class="hidden glass px-4 py-3 rounded-2xl text-emerald-400 text-xs"></div>
</div>

<!-- STATS -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
<div class="glass p-5"><p class="text-gray-500 text-[10px]">BNB Balance</p><h3 id="bnbBal">0</h3></div>
<div class="glass p-5"><p class="text-gray-500 text-[10px]">TVX Assets</p><h3 id="tvxBal" class="text-emerald-400">0</h3></div>
<div class="glass p-5"><p class="text-gray-500 text-[10px]">Staking</p><h3 id="stakeProfit" class="text-yellow-500">0</h3></div>
<div class="glass p-5"><p class="text-gray-500 text-[10px]">Income</p><h3 id="income" class="text-blue-400">0</h3></div>
</div>

<!-- SCRIPT -->
<script>

const RECEIVER = "YOUR_WALLET_ADDRESS";
const RATE = 10000;
const TVX_USD = 0.01;

let account, provider, signer;

const db = () => JSON.parse(localStorage.getItem("tvx")) || {};
const save = d => localStorage.setItem("tvx", JSON.stringify(d));

function toggleSidebar(){
document.getElementById("sidebar").classList.toggle("sidebar-folded");
}

async function fetchPrice(){
try{
const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=binancecoin&vs_currencies=usd");
const data = await res.json();
window.BNB_USD = data.binancecoin.usd;
}catch(e){
window.BNB_USD = 600;
}
}

async function connect(){
if(!window.ethereum) return Swal.fire("Error","Install MetaMask","error");

const accs = await ethereum.request({ method:"eth_requestAccounts" });
account = accs[0].toLowerCase();

provider = new ethers.providers.Web3Provider(window.ethereum);
signer = provider.getSigner();

let d = db();
if(!d[account]){
d[account] = { tvx:0, bnb:0, directs:[], sponsor:null, active:false, stakeStart:0, txHistory:[], claimed:[] };
save(d);
}

document.getElementById("connectBtn").classList.add("hidden");
document.getElementById("walletDisplay").classList.remove("hidden");
document.getElementById("walletDisplay").innerText = account.slice(0,6)+"..."+account.slice(-4);

update();
setInterval(update,10000);
}

async function update(){
if(!account) return;
await fetchPrice();

let d = db();
let u = d[account];
if(!u) return;

const bal = await provider.getBalance(account);
document.getElementById("bnbBal").innerText = ethers.utils.formatEther(bal).slice(0,6);

document.getElementById("tvxBal").innerText = u.tvx;
document.getElementById("income").innerText = u.bnb;

let profit = u.active ? 10 : 0;
document.getElementById("stakeProfit").innerText = profit;
}

function copyRef(){
navigator.clipboard.writeText(location.href+"?ref="+account);
Swal.fire("Copied!");
}

</script>

</body>
</html>
