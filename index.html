<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelX | Professional Web3 MLM</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body { background-color: #060b14; scroll-behavior: smooth; }
.glass { background: rgba(13, 19, 32, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
.custom-scrollbar::-webkit-scrollbar { width: 5px; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
#sidebar { transition: transform 0.3s ease-in-out; }
@media (max-width: 1024px) { .sidebar-folded { transform: translateX(-100%); } }
input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
</style>
</head>

<body class="text-white font-sans custom-scrollbar overflow-x-hidden">

<div class="min-h-screen flex flex-col lg:flex-row relative">

<!-- MOBILE TOP -->
<div class="lg:hidden flex justify-between items-center bg-[#0d1320] p-5 border-b border-white/10 sticky top-0 z-[100]">
<h1 class="text-2xl font-black text-emerald-400 italic">TRAVELX</h1>
<button onclick="toggleSidebar()" class="p-2 bg-emerald-400/10 rounded-lg text-emerald-400">
<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/>
</svg>
</button>
</div>

<!-- SIDEBAR -->
<aside id="sidebar" class="sidebar-folded w-full lg:w-72 bg-[#0d1320] border-r border-white/10 p-6 fixed lg:sticky top-0 h-screen z-[99] flex flex-col">
<h1 class="text-3xl font-black text-emerald-400 mb-10 italic">TRAVELX</h1>

<nav class="space-y-3 flex-1">
<a href="#" class="block px-4 py-3 rounded-2xl bg-emerald-400 text-black font-bold">Dashboard</a>
<a href="#buySection" class="block px-4 py-3 rounded-2xl bg-white/5">Buy & Swap</a>
<a href="#rewards" class="block px-4 py-3 rounded-2xl bg-white/5">VIP Rewards</a>
<a href="#reports" class="block px-4 py-3 rounded-2xl bg-white/5">Reports</a>
</nav>

<div class="mt-auto pt-6 border-t border-white/5 text-center">
<h4 class="font-bold text-[10px] text-emerald-400 uppercase font-mono italic">Account Rank</h4>
<p class="text-xl font-black mt-1 uppercase text-yellow-500" id="sideRank">NONE</p>
<button onclick="logout()" class="mt-6 text-red-500 text-xs font-bold hover:underline uppercase">Disconnect</button>
</div>
</aside>

<!-- MAIN -->
<main class="flex-1 p-4 lg:p-10 w-full overflow-x-hidden">

<div class="flex justify-between items-center mb-8 gap-4">
<div>
<h2 class="text-3xl lg:text-4xl font-black italic uppercase">Investor Portal</h2>
<p class="text-gray-500 text-sm">Earn 18% APY & Global Rewards</p>
</div>

<button id="connectBtn" onclick="connect()" class="bg-emerald-400 text-black px-6 py-3 rounded-2xl font-black">Connect</button>
<div id="walletDisplay" class="hidden glass px-4 py-3 rounded-2xl text-emerald-400 text-xs">0x...</div>
</div>

<!-- BUY -->
<section id="buySection" class="glass p-6 rounded-2xl mb-8">
<h3 class="text-emerald-400 font-black mb-4">Buy TVX Tokens</h3>

<input id="bnbInput" type="number" class="w-full p-4 bg-black/40 rounded-2xl" placeholder="BNB Amount">

<p class="mt-3">Get: <span id="previewTVX">0 TVX</span></p>

<button onclick="buy()" class="mt-4 bg-yellow-500 text-black font-black px-6 py-3 rounded-2xl">Buy Now</button>
</section>

</main>
</div>

<script>

const RECEIVER = "YOUR_WALLET_ADDRESS";
const RATE = 10000;
const TVX_USD = 0.01;

let BNB_USD = 600;
let account, provider, signer;

const db = () => JSON.parse(localStorage.getItem("tvx")) || {};
const save = d => localStorage.setItem("tvx", JSON.stringify(d));

function toggleSidebar(){
document.getElementById("sidebar").classList.toggle("sidebar-folded");
}

async function fetchPrice(){
try{
const res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=binancecoin&vs_currencies=usd");
const data = await res.json();
BNB_USD = data.binancecoin.usd;
}catch(e){
BNB_USD = 600;
}
}

async function connect(){
if(!window.ethereum) return Swal.fire("Error","MetaMask Required","error");

const accs = await window.ethereum.request({method:"eth_requestAccounts"});
account = accs[0].toLowerCase();

provider = new ethers.providers.Web3Provider(window.ethereum);
signer = provider.getSigner();

document.getElementById("connectBtn").style.display="none";
document.getElementById("walletDisplay").classList.remove("hidden");
document.getElementById("walletDisplay").innerText = account.slice(0,6)+"..."+account.slice(-4);

update();
setInterval(update, 10000);
}

/* SAFE UPDATE */
async function update(){
if(!account) return;
if(!provider) return;

await fetchPrice();

let d = db();
let u = d[account];
if(!u) return;

try{
const bal = await provider.getBalance(account);
document.getElementById("bnbBal") && (document.getElementById("bnbBal").innerText =
parseFloat(ethers.utils.formatEther(bal)).toFixed(4));
}catch(e){}

u.claimed = u.claimed || [];
u.directs = u.directs || [];

let profit = 0;

document.getElementById("tvxBal") && (document.getElementById("tvxBal").innerText = (u.tvx || 0));
document.getElementById("income") && (document.getElementById("income").innerText = (u.bnb || 0).toFixed(6));
document.getElementById("balDisplay") && (document.getElementById("balDisplay").innerText = "$" + (u.bnb || 0));

document.getElementById("stakeProfit") && (document.getElementById("stakeProfit").innerText = profit.toFixed(4));

let l1 = u.directs.length;

let rank = l1>=5 ? "VIP" : "NONE";
document.getElementById("sideRank").innerText = rank;
}

/* BUY */
async function buy(){
let bnb = document.getElementById("bnbInput").value;
if(!bnb) return;

try{
const tx = await signer.sendTransaction({
to: RECEIVER,
value: ethers.utils.parseEther(bnb)
});

await tx.wait();

let d = db();
if(!d[account]) d[account] = {tvx:0,bnb:0,claimed:[],directs:[]};

d[account].tvx += bnb * RATE;
save(d);

Swal.fire("Success","Purchased","success");

}catch(e){
Swal.fire("Error","Failed","error");
}
}

/* PREVIEW */
document.getElementById("bnbInput").addEventListener("input", e=>{
document.getElementById("previewTVX").innerText = (e.target.value * RATE || 0) + " TVX";
});

function logout(){
localStorage.removeItem("tvx_connected");
location.reload();
}

</script>
</body>
</html>
