<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelX Portal</title>

<!-- External Libraries -->
<script src="https://ethers.io"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
:root{
    --primary:#00ff99; --bg:#0b0f19; --card:#111827; --text:#ffffff; --text-dim:#9ca3af;
}
*{ margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif; }
body{ background:var(--bg); color:var(--text); min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; }

.card, .dashboard { width:100%; max-width:400px; background:var(--card); border-radius:20px; padding:25px; text-align:center; border:1px solid rgba(255,255,255,0.08); box-shadow:0 0 20px rgba(0,0,0,0.3); }
.logo{ width:60px; height:60px; border-radius:50%; background:linear-gradient(45deg,#00ff99,#00bfff); display:flex; justify-content:center; align-items:center; margin:0 auto 15px; font-size:24px; font-weight:bold; }

button{ width:100%; padding:14px; border:none; border-radius:12px; background:var(--primary); color:#000; font-weight:bold; cursor:pointer; margin-top:10px; transition:0.3s; }
.top-box{ background:rgba(255,255,255,0.03); border-radius:18px; padding:15px; margin-bottom:12px; text-align:left; border:1px solid rgba(255,255,255,0.05); }
.label{ color:var(--text-dim); font-size:12px; text-transform: uppercase; }
.wallet{ margin-top:4px; font-size:16px; color:var(--primary); font-family: monospace; }
input{ width:100%; padding:12px; border:none; border-radius:10px; background:#0d1117; color:#fff; margin-top:8px; outline:none; }
.tx-box{ background:#0d1117; padding:10px; border-radius:10px; margin-bottom:8px; border-left:3px solid var(--primary); font-size:11px; text-align:left; }
.tx-row{ display:flex; justify-content:space-between; }
</style>
</head>

<body>

<!-- CONNECT PAGE -->
<div id="connectPage" class="card">
    <div class="logo">T</div>
    <h1>TravelX</h1>
    <p style="color:gray; margin-bottom:20px;">Premium Staking Ecosystem</p>
    <button onclick="connectWallet()">Connect Web3 Wallet</button>
</div>

<!-- DASHBOARD -->
<div id="dashboardPage" class="dashboard" style="display:none;">
    <div class="top-box">
        <span class="label">Connected Wallet</span>
        <div class="wallet" id="walletAddress">0x000...000</div>
    </div>

    <!-- BALANCE SECTION -->
    <div style="display:flex; gap:10px; margin-bottom:12px;">
        <div class="top-box" style="flex:1; margin-bottom:0;">
            <span class="label">BNB</span>
            <div id="bnbBalance" style="font-weight:bold;">0.00</div>
        </div>
        <div class="top-box" style="flex:1; margin-bottom:0;">
            <span class="label">TRVX</span>
            <div id="trvxBalance" style="color:var(--primary); font-weight:bold;">0.00</div>
        </div>
    </div>

    <!-- STAKING & BUY -->
    <div class="top-box">
        <span class="label">Staking (18% APY)</span>
        <div id="stakedDisplay" style="font-size:18px; margin:5px 0;">0.00 TRVX</div>
        <button onclick="activateCard()" style="background:#1d4ed8; color:white;">Activate Card & Stake</button>
        <button onclick="claimReward()" style="background:transparent; color:gray; border:1px solid #334155;">Claim Reward</button>
    </div>

    <div class="top-box">
        <span class="label">ICO Sale (1 BNB = 10,000 TRVX)</span>
        <input type="number" id="bnbInput" placeholder="Amount in BNB">
        <button onclick="buyTokens()">Confirm Purchase</button>
    </div>

    <div class="top-box">
        <span class="label">Referral Link</span>
        <input type="text" id="refLink" readonly>
        <button onclick="copyRef()" style="background:#334155; color:white;">Copy Link</button>
    </div>

    <div class="top-box">
        <span class="label">Recent History</span>
        <div id="txHistoryList" style="max-height:100px; overflow-y:auto; margin-top:10px;"></div>
    </div>
</div>

<script>
let currentAccount = null;
let provider, signer;

// --- CONFIGURATION ---
const masterAddress = "YOUR_MASTER_CONTRACT_ADDRESS";
const tokenAddress = "YOUR_TOKEN_CONTRACT_ADDRESS";

const masterAbi = ["function buyTokens(address _ref) payable", "function activateCard(uint256 _amt)", "function claimDailyReward()", "function userStakes(address) view returns (uint256 amount, uint256 start, uint256 last, bool active)"];
const tokenAbi = ["function balanceOf(address) view returns (uint256)", "function approve(address s, uint256 a) returns (bool)"];

async function connectWallet(){
    if(!window.ethereum) return Swal.fire('Error', 'Install MetaMask', 'warning');
    const accounts = await window.ethereum.request({method:'eth_requestAccounts'});
    currentAccount = accounts[0];
    provider = new ethers.providers.Web3Provider(window.ethereum);
    signer = provider.getSigner();
    
    updateUI();
    setInterval(updateUI, 15000); // 15 sec auto refresh
}

async function updateUI(){
    try {
        const bnb = await provider.getBalance(currentAccount);
        document.getElementById('bnbBalance').innerText = parseFloat(ethers.utils.formatEther(bnb)).toFixed(4);

        const tCon = new ethers.Contract(tokenAddress, tokenAbi, provider);
        const trvx = await tCon.balanceOf(currentAccount);
        document.getElementById('trvxBalance').innerText = parseFloat(ethers.utils.formatUnits(trvx, 18)).toLocaleString();

        const mCon = new ethers.Contract(masterAddress, masterAbi, provider);
        const sInfo = await mCon.userStakes(currentAccount);
        document.getElementById('stakedDisplay').innerText = parseFloat(ethers.utils.formatUnits(sInfo.amount, 18)).toLocaleString() + " TRVX";

        document.getElementById('walletAddress').innerText = currentAccount.slice(0,6) + "..." + currentAccount.slice(-4);
        document.getElementById('connectPage').style.display = 'none';
        document.getElementById('dashboardPage').style.display = 'block';
        setupReferral();
        renderHistory();
    } catch(e) { console.log(e); }
}

async function buyTokens() {
    const amt = document.getElementById('bnbInput').value;
    const ref = new URLSearchParams(window.location.search).get('ref') || "0x0000000000000000000000000000000000000000";
    try {
        const mCon = new ethers.Contract(masterAddress, masterAbi, signer);
        const tx = await mCon.buyTokens(ref, {value: ethers.utils.parseEther(amt)});
        Swal.fire('Processing...', 'Please wait', 'info');
        await tx.wait();
        saveTx("Purchase", amt + " BNB", tx.hash);
        Swal.fire('Success', 'Tokens Bought!', 'success');
        updateUI();
    } catch(err) { Swal.fire('Error', 'Failed', 'error'); }
}

async function activateCard() {
    const amtStr = prompt("Amount of TRVX to stake:");
    if(!amtStr) return;
    const amt = ethers.utils.parseUnits(amtStr, 18);
    try {
        const tCon = new ethers.Contract(tokenAddress, tokenAbi, signer);
        Swal.fire('Step 1', 'Approving Token...', 'info');
        const appTx = await tCon.approve(masterAddress, amt);
        await appTx.wait();

        const mCon = new ethers.Contract(masterAddress, masterAbi, signer);
        Swal.fire('Step 2', 'Staking...', 'info');
        const sTx = await mCon.activateCard(amt);
        await sTx.wait();
        saveTx("Staked", amtStr + " TRVX", sTx.hash);
        Swal.fire('Done', 'Staked Successfully', 'success');
        updateUI();
    } catch(err) { Swal.fire('Error', 'Failed', 'error'); }
}

async function claimReward() {
    try {
        const mCon = new ethers.Contract(masterAddress, masterAbi, signer);
        const tx = await mCon.claimDailyReward();
        await tx.wait();
        saveTx("Reward", "Claimed", tx.hash);
        Swal.fire('Success', 'Reward Claimed!', 'success');
        updateUI();
    } catch(e) { Swal.fire('Wait', 'Try later', 'warning'); }
}

function saveTx(type, amount, hash){
    let history = JSON.parse(localStorage.getItem('travelx_tx_' + currentAccount)) || [];
    history.unshift({type, amount, hash, date:new Date().toLocaleDateString()});
    localStorage.setItem('travelx_tx_' + currentAccount, JSON.stringify(history.slice(0,8)));
    renderHistory();
}

function renderHistory(){
    const list = document.getElementById('txHistoryList');
    let history = JSON.parse(localStorage.getItem('travelx_tx_' + currentAccount)) || [];
    if(history.length === 0) { list.innerHTML = `<div style="color:gray;text-align:center;">No History</div>`; return; }
    list.innerHTML = history.map(tx => `
        <div class="tx-box">
            <div class="tx-row"><b>${tx.type}</b><span>${tx.amount}</span></div>
            <div class="tx-row" style="color:gray; margin-top:5px;"><span>${tx.date}</span><a href="https://testnet.bscscan.com/tx/${tx.hash}" target="_blank">View</a></div>
        </div>`).join('');
}

function setupReferral(){ document.getElementById('refLink').value = window.location.origin + window.location.pathname + '?ref=' + currentAccount; }
function copyRef(){ navigator.clipboard.writeText(document.getElementById('refLink').value); Swal.fire('Copied!', '', 'success'); }

</script>
</body>
</html>
