<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelX | Web3 MLM Dashboard</title>

    <!-- ✅ REQUIRED LIBRARIES -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { background-color: #060b14; scroll-behavior: smooth; }
        .glass { background: rgba(13, 19, 32, 0.95); border: 1px solid rgba(255,255,255,0.05); }
        #sidebar { transition: transform 0.3s ease-in-out; }
        @media (max-width: 1024px) {
            .sidebar-folded { transform: translateX(-100%); }
        }
    </style>
</head>

<body class="text-white">

<div class="min-h-screen flex flex-col lg:flex-row">

<!-- SIDEBAR -->
<aside id="sidebar" class="w-full lg:w-72 bg-[#0d1320] border-r p-6 fixed lg:sticky h-screen z-50 flex flex-col">

    <div class="flex justify-between items-center mb-10">
        <h1 class="text-3xl font-black text-emerald-400 italic">TRAVELX</h1>
        <button onclick="toggleSidebar()" class="lg:hidden text-2xl">×</button>
    </div>

    <nav class="space-y-3 flex-1">
        <a href="#" class="block px-4 py-3 bg-emerald-400 text-black rounded-xl text-center font-bold">Dashboard</a>
        <a href="#rewards" class="block px-4 py-3 bg-white/5 rounded-xl text-center">VIP Rewards</a>
    </nav>

    <div class="mt-auto text-center border-t border-white/10 pt-5">
        <p class="text-yellow-400 font-bold">Rank</p>
        <p id="sideRank" class="text-xl font-black">NONE</p>
    </div>

</aside>

<!-- MAIN -->
<main class="flex-1 p-4 lg:p-10">

    <!-- TOPBAR -->
    <div class="flex justify-between items-center mb-8">

        <div>
            <h2 class="text-3xl font-black">Investor Portal</h2>
            <p class="text-gray-400 text-sm">Earn Rewards & APY</p>
        </div>

        <div class="flex gap-3 items-center">
            <button id="connectBtn" onclick="connect()" class="bg-emerald-400 text-black px-5 py-2 rounded-xl font-bold">
                Connect
            </button>

            <div id="walletDisplay" class="hidden glass px-4 py-2 text-emerald-400 font-mono text-xs rounded-xl"></div>
        </div>

    </div>

    <!-- STATS -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-10">

        <div class="glass p-5 rounded-xl text-center">
            <p class="text-gray-400 text-xs">BNB Balance</p>
            <h3 id="bnbBal" class="text-xl font-black">0.0000</h3>
        </div>

        <div class="glass p-5 rounded-xl text-center">
            <p class="text-gray-400 text-xs">TVX Assets</p>
            <h3 id="tvxBal" class="text-xl font-black text-emerald-400">0</h3>
        </div>

        <div class="glass p-5 rounded-xl text-center">
            <p class="text-yellow-400 text-xs">Stake Reward</p>
            <h3 id="stakeProfit" class="text-xl font-black text-yellow-400">0.00 TVX</h3>
            <button class="mt-2 text-xs bg-yellow-500 text-black px-3 py-1 rounded">
                Withdraw
            </button>
        </div>

        <div class="glass p-5 rounded-xl text-center">
            <p class="text-blue-400 text-xs">MLM Income</p>
            <h3 id="income" class="text-xl font-black">0.0000</h3>
        </div>

    </div>

    <!-- REFERRAL -->
    <div class="glass p-6 rounded-2xl mb-10">

        <h3 class="text-emerald-400 font-black text-xl">Invite & Earn</h3>

        <div class="flex flex-col sm:flex-row gap-3 mt-4">
            <input id="refLink" readonly class="flex-1 bg-black/40 border border-white/10 px-4 py-3 rounded-xl text-emerald-400 font-mono">
            <button onclick="copyRef()" class="bg-emerald-400 text-black px-6 py-3 rounded-xl font-bold">
                Copy Link
            </button>
        </div>

    </div>

</main>
</div>

<script>
let provider, address;

function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("sidebar-folded");
}

async function connect() {
    if (!window.ethereum) {
        Swal.fire("MetaMask Not Found", "Please install MetaMask", "error");
        return;
    }

    try {
        const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
        address = accounts[0];

        provider = new ethers.providers.Web3Provider(window.ethereum);

        updateUI();

        Swal.fire({
            icon: "success",
            title: "Connected",
            background: "#0d1320",
            color: "#fff"
        });

    } catch (e) {
        console.error(e);
    }
}

async function updateUI() {
    if (!address) return;

    const balance = await provider.getBalance(address);

    document.getElementById("bnbBal").innerText =
        parseFloat(ethers.utils.formatEther(balance)).toFixed(4);

    document.getElementById("walletDisplay").classList.remove("hidden");
    document.getElementById("walletDisplay").innerText =
        address.slice(0,6) + "..." + address.slice(-4);

    document.getElementById("connectBtn").classList.add("hidden");

    const base = window.location.origin + window.location.pathname;
    document.getElementById("refLink").value = base + "?ref=" + address;
}

function copyRef() {
    if (!address) {
        Swal.fire("Warning", "Connect wallet first", "warning");
        return;
    }

    navigator.clipboard.writeText(document.getElementById("refLink").value);

    Swal.fire({
        toast: true,
        position: "top-end",
        icon: "success",
        title: "Copied!",
        timer: 1500,
        showConfirmButton: false
    });
}
</script>

</body>
</html>
