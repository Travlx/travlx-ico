<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <title>TravelX | Web3 Dashboard</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Ethers.js -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body{
            background:#060b14;
            scroll-behavior:smooth;
        }

        .glass{
            background:rgba(13,19,32,.95);
            border:1px solid rgba(255,255,255,.06);
            backdrop-filter:blur(10px);
        }

        #sidebar{
            transition:transform .3s ease;
        }

        .sidebar-hidden{
            transform:translateX(-100%);
        }

        @media(min-width:1024px){
            .sidebar-hidden{
                transform:translateX(0);
            }
        }
    </style>
</head>

<body class="text-white overflow-x-hidden">

<div class="min-h-screen flex">

    <!-- SIDEBAR -->
    <aside id="sidebar"
        class="sidebar-hidden lg:translate-x-0 fixed lg:static z-50 w-72 h-screen bg-[#0d1320] border-r border-white/10 p-6 flex flex-col">

        <h1 class="text-3xl font-black text-emerald-400 italic mb-10">
            TRAVELX
        </h1>

        <nav class="flex-1 space-y-3">
            <a href="#" class="block bg-emerald-400 text-black px-4 py-3 rounded-xl text-center font-bold">
                Dashboard
            </a>

            <a href="#" class="block bg-white/5 px-4 py-3 rounded-xl text-center hover:bg-emerald-400/10">
                Rewards
            </a>
        </nav>

        <button onclick="disconnectWallet()"
            class="text-red-500 text-xs font-bold mt-6">
            Disconnect
        </button>

    </aside>

    <!-- MAIN -->
    <main class="flex-1 p-5 lg:p-10">

        <!-- TOP -->
        <div class="flex justify-between items-center mb-8">

            <button onclick="toggleSidebar()" class="lg:hidden text-emerald-400 text-2xl">
                ☰
            </button>

            <div>
                <h2 class="text-3xl font-black italic">Investor Portal</h2>
                <p class="text-gray-500 text-xs">Web3 Dashboard</p>
            </div>

            <button id="connectBtn"
                onclick="connectWallet()"
                class="bg-emerald-400 text-black px-6 py-2 rounded-xl font-bold">
                Connect
            </button>

            <div id="walletDisplay"
                class="hidden glass px-3 py-2 text-emerald-400 text-xs font-mono rounded-xl">
            </div>

        </div>

        <!-- STATS -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-10">

            <div class="glass p-5 rounded-xl text-center">
                <p class="text-xs text-gray-400">BNB</p>
                <h3 id="bnbBal" class="text-xl font-bold">0.000</h3>
            </div>

            <div class="glass p-5 rounded-xl text-center">
                <p class="text-xs text-gray-400">TVX</p>
                <h3 class="text-xl font-bold text-emerald-400">0</h3>
            </div>

            <div class="glass p-5 rounded-xl text-center">
                <p class="text-xs text-gray-400">Reward</p>
                <h3 class="text-xl font-bold text-yellow-400">0</h3>
            </div>

            <div class="glass p-5 rounded-xl text-center">
                <p class="text-xs text-gray-400">Income</p>
                <h3 class="text-xl font-bold text-blue-400">0</h3>
            </div>

        </div>

        <!-- REFERRAL -->
        <div class="glass p-6 rounded-2xl">

            <h3 class="text-2xl font-black text-emerald-400">
                Referral Link
            </h3>

            <p id="refStatus"
                class="text-gray-400 text-xs mt-2 mb-4">
                Connect wallet to generate link
            </p>

            <div class="flex flex-col sm:flex-row gap-3">

                <input id="refLink"
                    readonly
                    class="flex-1 bg-black/40 border border-white/10 px-4 py-3 rounded-xl text-emerald-400 text-xs font-mono"
                />

                <button onclick="copyReferral()"
                    class="bg-emerald-400 text-black px-6 py-3 rounded-xl font-bold">
                    Copy
                </button>

            </div>

        </div>

    </main>
</div>

<script>

let provider;
let signer;
let address;

/* CONNECT */
async function connectWallet(){

    if(!window.ethereum){
        Swal.fire("MetaMask not found");
        return;
    }

    const accounts = await ethereum.request({
        method:"eth_requestAccounts"
    });

    provider = new ethers.providers.Web3Provider(window.ethereum);
    signer = provider.getSigner();
    address = accounts[0];

    updateUI();

}

/* UI UPDATE */
async function updateUI(){

    const balance = await provider.getBalance(address);

    document.getElementById("bnbBal").innerText =
        parseFloat(ethers.utils.formatEther(balance)).toFixed(4);

    document.getElementById("walletDisplay").classList.remove("hidden");
    document.getElementById("walletDisplay").innerText =
        address.slice(0,6)+"..."+address.slice(-4);

    document.getElementById("connectBtn").classList.add("hidden");

    const link = window.location.origin + "?ref=" + address;

    document.getElementById("refLink").value = link;

    document.getElementById("refStatus").innerText =
        "Share your link and earn rewards";

}

/* COPY */
async function copyReferral(){

    if(!address){
        Swal.fire("Connect wallet first");
        return;
    }

    await navigator.clipboard.writeText(
        document.getElementById("refLink").value
    );

    Swal.fire({
        toast:true,
        position:"top-end",
        icon:"success",
        title:"Copied",
        timer:1500,
        showConfirmButton:false
    });

}

/* SIDEBAR */
function toggleSidebar(){
    document.getElementById("sidebar")
        .classList.toggle("sidebar-hidden");
}

/* DISCONNECT */
function disconnectWallet(){

    address = null;

    document.getElementById("connectBtn").classList.remove("hidden");
    document.getElementById("walletDisplay").classList.add("hidden");

}

</script>

</body>
</html>
