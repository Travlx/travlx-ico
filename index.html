<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelX | Professional Web3 MLM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #060b14; scroll-behavior: smooth; }
        .glass { background: rgba(13, 19, 32, 0.95); border: 1px solid rgba(255,255,255,0.05); }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
        #sidebar { transition: transform 0.3s ease-in-out; }
        @media (max-width: 1024px) { .sidebar-folded { transform: translateX(-100%); } }
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    </style>
</head>
<body class="text-white font-sans custom-scrollbar overflow-x-hidden">

<div class="min-h-screen flex flex-col lg:flex-row relative">

    <!-- MOBILE TOP -->
    <div class="lg:hidden flex justify-between items-center bg-[#0d1320] p-5 border-b border-white/10 sticky top-0 z-[100]">
        <h1 class="text-2xl font-black text-emerald-400 italic">TRAVELX</h1>
        <button onclick="toggleSidebar()" class="p-2 bg-emerald-400/10 rounded-lg text-emerald-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/></svg>
        </button>
    </div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar-folded w-full lg:w-72 bg-[#0d1320] border-r border-white/10 p-6 fixed lg:sticky top-0 h-screen z-[99] flex flex-col">
        <h1 class="text-3xl font-black text-emerald-400 mb-10 italic">TRAVELX</h1>
        <nav class="space-y-3 flex-1 text-sm font-bold">
            <a href="#" onclick="toggleSidebar()" class="block px-4 py-3 rounded-2xl bg-emerald-400 text-black">Dashboard</a>
            <a href="#buySection" onclick="toggleSidebar()" class="block px-4 py-3 rounded-2xl bg-white/5 hover:bg-emerald-400/10 transition">Buy & Swap</a>
            <a href="#rewards" onclick="toggleSidebar()" class="block px-4 py-3 rounded-2xl bg-white/5 hover:bg-emerald-400/10 transition">VIP Rewards</a>
            <a href="#reports" onclick="toggleSidebar()" class="block px-4 py-3 rounded-2xl bg-white/5 hover:bg-emerald-400/10 transition">Reports</a>
        </nav>
        <div class="mt-auto pt-6 border-t border-white/5 text-center">
            <h4 class="font-bold text-[10px] text-emerald-400 uppercase italic">Rank Status</h4>
            <p class="text-xl font-black mt-1 uppercase text-yellow-500" id="sideRank">NONE</p>
            <button onclick="logout()" class="mt-6 text-red-500 text-xs font-bold uppercase hover:underline">Disconnect</button>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 p-4 lg:p-10 w-full overflow-x-hidden">
        
        <!-- TOPBAR (Wallet Connect & Portal Header) -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
            <div>
                <h2 class="text-3xl lg:text-4xl font-black italic uppercase">Investor Portal</h2>
                <p class="text-gray-500 text-sm">Earn 36% APY & Global Rewards</p>
            </div>
            <div class="flex items-center gap-3">
                <button id="connectBtn" onclick="connect()" class="bg-emerald-400 text-black px-6 py-3 rounded-2xl font-black shadow-lg hover:bg-emerald-500 transition">Connect</button>
                <div id="walletDisplay" class="hidden glass px-4 py-2 rounded-xl text-emerald-400 text-xs font-mono border border-emerald-400/20">0x...</div>
            </div>
        </div>

        <!-- PASAPASI CODES / WIDGETS SECTION -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
            
            <!-- ১ম বক্স: Referral Link (আপনার আগের কোড) -->
            <div class="glass p-5 rounded-2xl border border-emerald-400/20 flex flex-col justify-center">
                <p class="text-xs text-gray-400 uppercase font-bold">Referral Link</p>
                <div class="flex gap-2 mt-3">
                    <input id="refLink" readonly
                        class="w-full p-3 bg-black/40 rounded-xl text-emerald-400 font-mono text-xs focus:outline-none"
                        placeholder="Generate your referral link" />
                    <button onclick="copyRef()"
                        class="bg-emerald-400 text-black px-5 rounded-xl font-bold text-xs hover:bg-emerald-500 transition">
                        COPY
                    </button>
                </div>
            </div>

            <!-- ২য় বক্স: (এখানে আপনি আপনার অন্য কোড বা উইজেট বসাতে পারবেন) -->
            <div class="glass p-5 rounded-2xl border border-white/10 flex flex-col justify-center">
                <p class="text-xs text-gray-400 uppercase font-bold">Investment Overview</p>
                <div class="grid grid-cols-2 gap-4 mt-3">
                    <div class="bg-black/40 p-3 rounded-xl">
                        <span class="text-[10px] text-gray-500 uppercase block">Total Staked</span>
                        <span class="text-emerald-400 font-bold text-sm">$0.00</span>
                    </div>
                    <div class="bg-black/40 p-3 rounded-xl">
                        <span class="text-[10px] text-gray-500 uppercase block">Total Rewards</span>
                        <span class="text-emerald-400 font-bold text-sm">$0.00</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- বাকি সেকশনগুলোর জন্য এখানে কোড যুক্ত করতে পারেন -->

    </main>
</div>

<script>
    // আপনার জাভাস্ক্রিপ্ট ফাংশনগুলো এখানে থাকবে (যেমন: toggleSidebar, connect, copyRef ইত্যাদি)
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('sidebar-folded');
    }
</script>
</body>
</html>
