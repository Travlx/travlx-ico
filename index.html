<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelX ICO | Ultimate Web3 Portal</title>
    <!-- Libraries -->
    <script src="https://ethers.io"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        :root { --primary: #238636; --bg: #05070a; --card: #0d1117; --blue: #58a6ff; --text-dim: #8b949e; }
        body { background-color: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { text-align: center; border: 1px solid #2d333b; padding: 25px; border-radius: 24px; background: var(--card); width: 100%; max-width: 420px; box-shadow: 0 25px 60px rgba(0,0,0,0.6); }
        .token-logo { width: 60px; height: 60px; background: linear-gradient(45deg, var(--blue), var(--primary)); border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-weight: bold; animation: rotateLogo 5s infinite linear; box-shadow: 0 0 15px rgba(88, 166, 255, 0.3); }
        @keyframes rotateLogo { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }
        .btn { background-color: var(--primary); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; width: 100%; transition: 0.3s; margin-top: 10px; font-size: 14px; }
        .btn-blue { background: linear-gradient(90deg, #3b82f6, #2563eb); }
        .btn-outline { background: transparent; border: 1px solid #30363d; color: var(--text-dim); }
        #dashboard { display: none; text-align: left; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .info-card { background: #161b22; padding: 15px; border-radius: 16px; margin-bottom: 12px; border: 1px solid #30363d; }
        .label { color: var(--text-dim); font-size: 10px; text-transform: uppercase; font-weight: bold; display: block; margin-bottom: 5px; letter-spacing: 0.5px; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #30363d; background: #010409; color: white; outline: none; box-sizing: border-box; margin-bottom: 5px; }
        .stat-grid { display: flex; gap: 10px; margin-bottom: 12px; }
        .stat-box { flex: 1; background: #0d1117; padding: 10px; border-radius: 12px; border: 1px solid #30363d; }
        #txHistoryList { max-height: 120px; overflow-y: auto; margin-top: 10px; scrollbar-width: thin; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Login Section -->
        <div id="loginScreen">
            <div class="token-logo">X</div>
            <h1 style="color: var(--blue); margin-bottom: 5px;">TravelX</h1>
            <p style="color: var(--text-dim); font-size: 14px; margin-bottom: 25px;">Decentralized Staking Ecosystem</p>
            <button onclick="connect()" class="btn">Connect Web3 Wallet</button>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard">
            <div class="info-card">
                <span class="label">Connected Wallet</span>
                <span id="userAddress" style="color: var(--blue); font-family: monospace; font-size: 12px;"></span>
            </div>

            <div class="stat-grid">
                <div class="stat-box"><span class="label">BNB Balance</span><span id="bnbBalance" style="font-weight: bold;">0.00</span></div>
                <div class="stat-box"><span class="label">TRVX Asset</span><span id="trvxBalance" style="color:var(--primary); font-weight: bold;">0.00</span></div>
            </div>

            <!-- Staking Display -->
            <div class="info-card" style="border-left: 4px solid var(--primary);">
                <span class="label">Total Staked (18% APY)</span>
                <span id="stakedDisplay" style="font-size: 20px; font-weight: bold;">0.00 TRVX</span>
                <button onclick="activateCard()" class="btn">Activate Card & Stake</button>
                <button onclick="claimReward()" class="btn btn-outline">Claim Daily Earning</button>
            </div>

            <!-- ICO Buy Section -->
            <div class="info-card">
                <span class="label">Buy TRVX (1 BNB = 10,000 TRVX)</span>
                <input type="number" id="bnbInput" placeholder="Amount in BNB">
                <button onclick="buyTokens()" class="btn btn-blue">Confirm Purchase</button>
            </div>

            <!-- Referral Link -->
            <div class="info-card">
                <span class="label">Referral Program (5% Commission)</span>
                <input type="text" id="refLink" readonly style="font-size: 10px; background: #010409;">
                <button onclick="copyRef()" style="background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:11px; text-decoration:underline; width: 100%;">Copy Invite Link</button>
            </div>

            <!-- History -->
            <div class="info-card">
                <span class="label">Recent Activity</span>
                <div id="txHistoryList">
                    <p style="text-align: center; color: #484f58; font-size: 11px;">No transaction history</p>
                </div>
            </div>
            
            <button onclick="window.location.reload()" style="color:#f85149; background:none; border:none; width:100%; cursor:pointer; font-size:12px; margin-top: 10px;">Disconnect Session</button>
        </div>
    </div>

    <audio id="successSound" src="https://mixkit.co"></audio>

    <script>
        let signer, provider, currentAccount;
        
        // --- YOUR SMART CONTRACT ADDRESSES ---
        const masterAddress = "YOUR_MASTER_CONTRACT_ADDRESS"; 
        const tokenAddress = "YOUR_TOKEN_CONTRACT_ADDRESS";
        
        const masterAbi = [
            "function buyTokens(address _referrer) public payable",
            "function activateCard(uint256 _amount) public",
            "function claimDailyReward() public",
            "function userStakes(address) view returns (uint256 amount, uint256 startTime, uint256 lastClaimTime, bool isActive)"
        ];
        const tokenAbi = [
            "function balanceOf(address) view returns (uint256)", 
            "function approve(address spender, uint256 amount) public returns (bool)"
        ];

        async function connect() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    currentAccount = accounts[0];
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    signer = provider.getSigner();
                    
                    setupReferral();
                    renderHistory();
                    updateUI();
                    
                    // Listeners for network/account changes
                    window.ethereum.on('accountsChanged', () => window.location.reload());
                    window.ethereum.on('chainChanged', () => window.location.reload());
                    
                    setInterval(updateUI, 15000);
                } catch (e) { Swal.fire('Error', 'Connection rejected', 'error'); }
            } else { Swal.fire('Missing Wallet', 'Please install MetaMask!', 'info'); }
        }

        async function updateUI() {
            try {
                const bnbBal = await provider.getBalance(currentAccount);
                document.getElementById('bnbBalance').innerText = parseFloat(ethers.utils.formatEther(bnbBal)).toFixed(4);

                const tokenContract = new ethers.Contract(tokenAddress, tokenAbi, provider);
                const trvxBal = await tokenContract.balanceOf(currentAccount);
                document.getElementById('trvxBalance').innerText = parseFloat(ethers.utils.formatUnits(trvxBal, 18)).toLocaleString();

                const masterContract = new ethers.Contract(masterAddress, masterAbi, provider);
                const stakeInfo = await masterContract.userStakes(currentAccount);
                document.getElementById('stakedDisplay').innerText = parseFloat(ethers.utils.formatUnits(stakeInfo.amount, 18)).toLocaleString() + " TRVX";

                document.getElementById('userAddress').innerText = currentAccount.slice(0,6) + "..." + currentAccount.slice(-4);
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            } catch (e) { console.error("UI Update Error", e); }
        }

        async function buyTokens() {
            const amount = document.getElementById('bnbInput').value;
            if(!amount || amount <= 0) return Swal.fire('Alert', 'Enter valid BNB amount', 'warning');

            // Ref Validation
            let ref = new URLSearchParams(window.location.search).get('ref');
            if (!ref || !ethers.utils.isAddress(ref)) ref = "0x0000000000000000000000000000000000000000";

            try {
                Swal.fire({ title: 'Processing Purchase', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                const masterContract = new ethers.Contract(masterAddress, masterAbi, signer);
                const tx = await masterContract.buyTokens(ref, { value: ethers.utils.parseEther(amount.toString()) });
                
                await tx.wait();
                saveTx("ICO Purchase", amount + " BNB", tx.hash);
                document.getElementById('successSound').play();
                Swal.fire('Success', 'Tokens added to wallet!', 'success');
                updateUI();
            } catch (err) { Swal.fire('Error', 'Transaction failed or rejected', 'error'); }
        }

        async function activateCard() {
            const amtStr = prompt("Enter TRVX amount to stake:");
            if (!amtStr || isNaN(amtStr)) return;
            const amt = ethers.utils.parseUnits(amtStr, 18);

            try {
                // Step 1: Check Token Balance
                const tokenContract = new ethers.Contract(tokenAddress, tokenAbi, signer);
                const bal = await tokenContract.balanceOf(currentAccount);
                if(bal.lt(amt)) return Swal.fire('Error', 'Insufficient TRVX balance', 'error');

                Swal.fire({ title: 'Step 1: Approval', text: 'Granting permission to stake', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                const appTx = await tokenContract.approve(masterAddress, amt);
                await appTx.wait();

                Swal.fire({ title: 'Step 2: Staking', text: 'Locking tokens for 360 days', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                const masterContract = new ethers.Contract(masterAddress, masterAbi, signer);
                const stakeTx = await masterContract.activateCard(amt);
                await stakeTx.wait();
                
                saveTx("Staked Asset", amtStr + " TRVX", stakeTx.hash);
                Swal.fire('Completed', 'Staking activated successfully!', 'success');
                updateUI();
            } catch (err) { Swal.fire('Failed', 'Staking process interrupted', 'error'); }
        }

        async function claimReward() {
            try {
                const masterContract = new ethers.Contract(masterAddress, masterAbi, signer);
                const tx = await masterContract.claimDailyReward();
                Swal.fire({ title: 'Claiming Reward...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                await tx.wait();
                saveTx("Reward Claim", "Daily", tx.hash);
                Swal.fire('Claimed', 'Daily reward sent to wallet!', 'success');
                updateUI();
            } catch (err) { Swal.fire('Wait!', 'Rewards available once every 24h', 'warning'); }
        }

        function saveTx(type, amount, hash) {
            let history = JSON.parse(localStorage.getItem('travelx_tx_' + currentAccount)) || [];
            history.unshift({ type, amount, hash, date: new Date().toLocaleDateString() });
            localStorage.setItem('travelx_tx_' + currentAccount, JSON.stringify(history.slice(0, 8)));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('txHistoryList');
            let history = JSON.parse(localStorage.getItem('travelx_tx_' + currentAccount)) || [];
            if (history.length === 0) return;
            list.innerHTML = history.map(tx => `
                <div style="background:#0d1117; padding:10px; border-radius:10px; margin-bottom:6px; border-left:3px solid var(--primary); font-size:10px;">
                    <div style="display:flex; justify-content:space-between;"><b>${tx.type}</b> <span>${tx.amount}</span></div>
                    <div style="display:flex; justify-content:space-between; color:var(--text-dim); margin-top:4px;"><span>${tx.date}</span> <a href="https://bscscan.com{tx.hash}" target="_blank" style="color:var(--blue); text-decoration:none;">View Scan</a></div>
                </div>
            `).join('');
        }

        function setupReferral() {
            document.getElementById('refLink').value = window.location.origin + window.location.pathname + "?ref=" + currentAccount;
        }

        function copyRef() {
            navigator.clipboard.writeText(document.getElementById("refLink").value);
            Swal.fire({ title: 'Copied!', icon: 'success', timer: 1000, showConfirmButton: false });
        }
    </script>
</body>
</html>
