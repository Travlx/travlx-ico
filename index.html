<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRVX Auto Payout | Pro Edition</title>

<!-- ✅ FIXED LIBRARIES -->
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:#0b0f19;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}
.box{
    width:100%;
    max-width:420px;
    background:#111827;
    padding:25px;
    border-radius:24px;
    border:1px solid rgba(255,255,255,0.05);
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
}
input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:12px;
    background:#0d1117;
    color:#fff;
    outline:none;
    border:1px solid #1f2937;
    box-sizing:border-box;
}
button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
}
.primary{background:#00ff99;color:#000;}
.blue{background:#2563eb;color:#fff;}
.warn{background:transparent;color:#f59e0b;border:1px solid #f59e0b;}
.small{font-size:13px;color:#9ca3af;margin-top:8px;display:flex;justify-content:space-between;}
hr{border:0;border-top:1px solid #1f2937;margin:20px 0;}
</style>
</head>

<body>

<div class="box">
<h2 style="text-align:center;color:#00ff99;margin-top:0;">TRVX Staking</h2>

<div id="connectBtn">
    <button class="primary" onclick="connect()">Connect Wallet</button>
</div>

<div id="dashboard" style="display:none;">

    <div class="small">
        <span>Wallet:</span>
        <span id="wallet" style="color:#00ff99;font-family:monospace;">0x...</span>
    </div>

    <hr>

    <label class="small">Enter TRVX Amount</label>
    <input type="number" id="amount" placeholder="0.00">

    <button class="blue" id="stakeBtn" onclick="stake()">Stake TRVX</button>
    <button class="warn" onclick="withdraw()">Withdraw (Auto Payout)</button>

    <hr>

    <div class="small">
        <span>Staked:</span>
        <span><b id="staked">0</b> TRVX</span>
    </div>

    <div class="small">
        <span>Pending Reward:</span>
        <span style="color:#00ff99;"><b id="reward">0</b> TRVX</span>
    </div>

</div>
</div>

<script>

let provider, signer, account;

// 🔧 CONFIG
const contractAddress = "YOUR_STAKING_CONTRACT_ADDRESS";
const tokenAddress = "YOUR_TOKEN_CONTRACT_ADDRESS";

// ABIs
const stakingAbi = [
    "function stake(uint256)",
    "function withdraw() returns(uint256)",
    "function pendingReward(address) view returns(uint256)",
    "function getStake(address) view returns(uint256,uint256)"
];

const tokenAbi = [
    "function approve(address,uint256) returns(bool)",
    "function allowance(address,address) view returns(uint256)"
];

// ================= CONNECT =================
async function connect(){
    try{
        if(!window.ethereum){
            Swal.fire("Error","MetaMask not installed","error");
            return;
        }

        const acc = await ethereum.request({method:"eth_requestAccounts"});
        account = acc[0];

        provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = provider.getSigner();

        document.getElementById("wallet").innerText =
            account.slice(0,6)+"..."+account.slice(-4);

        document.getElementById("connectBtn").style.display="none";
        document.getElementById("dashboard").style.display="block";

        updateAll();
        setInterval(updateAll, 8000);

    }catch(e){
        console.log(e);
    }
}

// ================= CONTRACT =================
function getStaking(){
    return new ethers.Contract(contractAddress, stakingAbi, signer);
}
function getToken(){
    return new ethers.Contract(tokenAddress, tokenAbi, signer);
}

// ================= STAKE =================
async function stake(){
    const btn = document.getElementById("stakeBtn");

    try{
        const val = document.getElementById("amount").value;

        if(!val || val <= 0){
            Swal.fire("Error","Enter valid amount","warning");
            return;
        }

        const amount = ethers.utils.parseUnits(val.toString(),18);

        const t = getToken();
        const s = getStaking();

        btn.innerText = "Processing...";
        btn.disabled = true;

        // check allowance
        const allowance = await t.allowance(account, contractAddress);

        if(allowance.lt(amount)){
            const tx1 = await t.approve(contractAddress, ethers.constants.MaxUint256);
            await tx1.wait();
        }

        const tx2 = await s.stake(amount);
        await tx2.wait();

        Swal.fire("Success","Staked Successfully","success");

        document.getElementById("amount").value = "";

    }catch(e){
        console.log(e);
        Swal.fire("Error","Stake Failed","error");
    }finally{
        btn.innerText = "Stake TRVX";
        btn.disabled = false;
        updateAll();
    }
}

// ================= WITHDRAW =================
async function withdraw(){
    try{
        const s = getStaking();

        Swal.fire({
            title:"Confirm Withdraw",
            text:"Withdraw reward + payout",
            icon:"question",
            showCancelButton:true,
            confirmButtonText:"Yes"
        }).then(async (res)=>{
            if(res.isConfirmed){
                const tx = await s.withdraw();
                await tx.wait();

                Swal.fire("Success","Payout Done","success");
                updateAll();
            }
        });

    }catch(e){
        console.log(e);
        Swal.fire("Error","Nothing to withdraw","error");
    }
}

// ================= UPDATE =================
async function updateAll(){
    try{
        if(!account || !provider) return;

        const s = new ethers.Contract(contractAddress, stakingAbi, provider);

        const r = await s.pendingReward(account);
        const st = await s.getStake(account);

        document.getElementById("reward").innerText =
            parseFloat(ethers.utils.formatUnits(r || 0,18)).toFixed(4);

        document.getElementById("staked").innerText =
            parseFloat(ethers.utils.formatUnits(st[0] || 0,18)).toFixed(2);

    }catch(e){
        console.log("update error", e);
    }
}

</script>

</body>
</html>
