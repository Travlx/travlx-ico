<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelX ICO | Web3 Launch</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        body { background: radial-gradient(circle at top right, #1e293b, #05070a); color: white; min-height: 100vh; font-family: sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="p-6">
    <div class="max-w-4xl mx-auto text-center py-12">
        <h1 class="text-5xl font-bold mb-4 tracking-tight">TravelX <span class="text-blue-500">ICO Launch</span></h1>
        <p class="text-gray-400 mb-8">Secure your TRVX tokens on the BSC Network</p>
        
        <button id="connectBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-full font-bold transition shadow-lg shadow-blue-500/20">
            Connect Wallet
        </button>
        <p id="walletAddress" class="mt-4 text-green-400 font-mono text-sm"></p>

        <div class="mt-12 glass p-8 rounded-3xl max-w-md mx-auto">
            <h2 class="text-xl font-bold mb-6">Presale Purchase</h2>
            <input type="number" id="bnbAmount" placeholder="BNB Amount" class="w-full bg-black/50 border border-gray-700 rounded-xl p-3 mb-4 outline-none focus:border-blue-500 transition text-white">
            <button id="buyBtn" class="w-full bg-white text-black font-bold py-3 rounded-xl hover:bg-gray-200 transition">Buy TRVX Tokens</button>
            <p class="text-[10px] text-gray-500 mt-4 italic">*Please make sure you are on BSC Mainnet</p>
        </div>
    </div>

    <script>
        let signer = null;

        async function connect() {
            if (window.ethereum) {
                try {
                    const provider = new ethers.BrowserProvider(window.ethereum);
                    const accounts = await provider.send("eth_requestAccounts", []);
                    signer = await provider.getSigner();
                    
                    const addr = accounts[0];
                    document.getElementById('walletAddress').innerText = "Connected: " + addr.substring(0, 6) + "..." + addr.substring(38);
                    document.getElementById('connectBtn').innerText = "Connected ✅";
                    document.getElementById('connectBtn').classList.replace('bg-blue-600', 'bg-green-600');
                } catch (err) {
                    console.error(err);
                    alert("Connection failed! Please check MetaMask.");
                }
            } else {
                alert("MetaMask not found! Please install it.");
            }
        }

        document.getElementById('connectBtn').addEventListener('click', connect);
    </script>
</body>
</html>
