<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelX | Professional Web3 MLM</title>
    <!-- Essential Library Imports -->
    <script src="https://tailwindcss.com"></script>
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    
    <style>
        body { background-color: #060b14; scroll-behavior: smooth; }
        .glass { background: rgba(13, 19, 32, 0.95); border: 1px solid rgba(255,255,255,0.05); }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
        #sidebar { transition: transform 0.3s ease-in-out; }
        @media (max-width: 1024px) { .sidebar-hidden { transform: translateX(-100%); } }
    </style>
</head>
<body class="text-white font-sans custom-scrollbar overflow-x-hidden">

<div class="min-h-screen flex flex-col lg:flex-row relative">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar-hidden w-full lg:w-72 bg-[#0d1320] border-r border-white/10 p-6 fixed lg:sticky top-0 h-screen z-[99] flex flex-col">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-black text-emerald-400 italic">TRAVELX</h1>
            <button onclick="toggleSidebar()" class="lg:hidden text-white text-2xl">×</button>
        </div>
        <nav class="space-y-3 flex-1 text-sm font-bold">
            <a href="#" class="block px-4 py-3 rounded-2xl bg-emerald-400 text-black text-center">Dashboard</a>
            <a href="#rewards" class="block px-4 py-3 rounded-2xl bg-white/5 hover:bg-emerald-400/10 transition text-center">VIP Rewards</a>
        </nav>
        <div class="mt-auto pt-6 border-t border-white/5 text-center">
            <h4 class="font-bold text-[10px] text-emerald-400 uppercase italic">Rank Status</h4>
            <p id="sideRank" class="text-xl font-black mt-1 uppercase text-yellow-500">NONE</p>
            <button onclick="location.reload()" class="mt-6 text-red-500 text-xs font-bold uppercase hover:underline">Disconnect</button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 p-4 lg:p-10 w-full overflow-x-hidden">
        <!-- TOPBAR -->
        <div class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="lg:hidden p-2 bg-emerald-400/10 rounded-lg">
                    <svg class="w-6 h-6 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                </button>
                <div>
                    <h2 class="text-2xl lg:text-4xl font-black italic uppercase">Investor Portal</h2>
                    <p class="text-gray-500 text-xs lg:text-sm">Earn 18% APY & Global Rewards</p>
                </div>
            </div>
            <div class="flex gap-3">
                <button id="connectBtn" onclick="connect()" class="bg-emerald-400 text-black px-4 lg:px-6 py-2 lg:py-3 rounded-2xl font-black shadow-lg text-xs lg:text-base">Connect Wallet</button>
                <div id="walletDisplay" class="hidden glass px-4 py-2 rounded-xl text-emerald-400 text-xs font-mono border border-emerald-400/20">0x...</div>
            </div>
        </div>

        <!-- STATS GRID -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="glass p-5 rounded-2xl border-l-4 border-white text-center"><p class="text-gray-500 text-[10px] font-bold uppercase">BNB Balance</p><h3 id="bnbBal" class="text-xl font-black mt-1">0.0000</h3></div>
            <div class="glass p-5 rounded-2xl border-l-4 border-emerald-400 text-center"><p class="text-gray-500 text-[10px] font-bold uppercase">TVX Assets</p><h3 id="tvxBal" class="text-xl font-black mt-1 text-emerald-400">0</h3></div>
            <div class="glass p-5 rounded-2xl border-l-4 border-yellow-500 bg-yellow-500/5 text-center">
                <p class="text-yellow-500 text-[10px] font-bold uppercase italic">Staking Reward</p>
                <h3 id="stakeProfit" class="text-xl font-black mt-1 text-yellow-500">0.00 TVX</h3>
                <button onclick="Swal.fire({title:'Info', text:'Smart Contract not connected', icon:'info', background:'#0d1320', color:'#fff'})" class="mt-2 text-[10px] bg-yellow-500 text-black px-3 py-1 rounded-lg font-bold uppercase">Withdraw</button>
            </div>
            <div class="glass p-5 rounded-2xl border-l-4 border-blue-500 text-center"><p class="text-gray-500 text-[10px] font-bold uppercase italic">MLM Income</p><h3 id="income" class="text-xl font-black mt-1 text-blue-400">0.0000</h3></div>
        </div>

        <!-- REFERRAL LINK BOX -->
        <div class="glass p-6 lg:p-8 rounded-[35px] border border-emerald-400/20 mb-10 shadow-xl shadow-emerald-500/5">
            <h3 class="text-xl font-black mb-2 uppercase italic text-emerald-400">Invite & Earn</h3>
            <p class="text-gray-400 text-[10px] lg:text-xs mb-4 uppercase font-bold">Connect wallet to generate referral link</p>
            <div class="flex flex-col sm:flex-row gap-3">
                <input id="refLink" readonly type="text" placeholder="Please Connect Wallet" class="flex-1 bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-xs font-mono text-emerald-400 focus:outline-none focus:border-emerald-400/50 transition-all">
                <button onclick="copyRef()" class="bg-emerald-400 text-black px-8 py-3 rounded-xl font-black text-xs uppercase hover:bg-emerald-500 transition-all active:scale-95">Copy Link</button>
            </div>
        </div>

        <!-- REWARDS -->
        <div id="rewards" class="mb-10">
            <h3 class="text-xl font-black mb-6 uppercase italic text-emerald-400">🏆 VIP Rewards</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-center">
                <div class="glass p-6 rounded-[35px] border border-white/5 relative">
                    <h4 class="font-black text-xl italic uppercase">V1 VIP</h4>
                    <p class="text-[9px] text-gray-500 font-bold mt-1 uppercase italic">25 Team + 5 Directs</p>
                    <p class="mt-4 text-xs font-black italic text-emerald-400">$500 BONUS</p>
                    <button disabled class="w-full mt-6 py-4 bg-white/5 rounded-2xl text-[10px] font-black uppercase opacity-20">Locked</button>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    let provider, address;

    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('sidebar-hidden');
    }

    async function connect() {
        if (typeof window.ethereum !== 'undefined') {
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                address = accounts[0];
                provider = new ethers.providers.Web3Provider(window.ethereum);

                updateUI();
                
                Swal.fire({ 
                    icon: 'success', 
                    title: 'Connected!', 
                    text: 'Wallet successfully connected.',
                    background: '#0d1320', 
                    color: '#fff', 
                    confirmButtonColor: '#10b981' 
                });
            } catch (err) { 
                console.error(err); 
            }
        } else {
            Swal.fire({
                icon: 'error',
                title: 'MetaMask Not Found',
                text: 'Please install MetaMask extension',
                background: '#0d1320',
                color: '#fff'
            });
        }
    }

    async function updateUI() {
        if (!address) return;

        const balance = await provider.getBalance(address);
        document.getElementById('bnbBal').innerText = parseFloat(ethers.utils.formatEther(balance)).toFixed(4);

        document.getElementById('walletDisplay').innerText = address.slice(0,6) + "..." + address.slice(-4);
        document.getElementById('walletDisplay').classList.remove('hidden');
        document.getElementById('connectBtn').classList.add('hidden');

        const currentUrl = window.location.origin + window.location.pathname;
        document.getElementById('refLink').value = currentUrl + "?ref=" + address;
    }

    function copyRef() {
        const copyText = document.getElementById("refLink");
        if(!address) {
            Swal.fire({ title: 'Alert', text: 'Connect wallet first!', icon: 'warning', background: '#0d1320', color: '#fff' });
            return;
        }
        copyText.select();
        copyText.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(copyText.value);
        
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: 'success',
            title: 'Copied to clipboard!',
            showConfirmButton: false,
            timer: 2000,
            background: '#0d1320', 
            color: '#fff'
        });
    }
</script>
</body>
</html>
