<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TravelX Dashboard</title>

<!-- Tailwind CSS -->
<script src="tailwindcss.com"></script>

<!-- Ethers.js -->
<script src="jsdelivr.net"></script>

<style>
body { background: #060b14; scroll-behavior: smooth; font-family: sans-serif; }
.glass { background: rgba(13,19,32,.95); border: 1px solid rgba(255, 255, 255, 0.05); }
#sidebar { transition: .3s; }
.sidebar-folded { transform: translateX(-100%); }
@media (min-width: 1024px) {
  .sidebar-folded { transform: translateX(0); }
}
</style>
</head>

<body class="text-white">

<div class="flex">

<!-- SIDEBAR -->
<aside id="sidebar" class="w-72 bg-[#0d1320] min-h-screen p-5 fixed lg:static sidebar-folded z-50 flex flex-col justify-between">
<div>
<h1 class="text-2xl text-emerald-400 font-black tracking-wider">TRAVELX</h1>
<p class="text-xs text-gray-500 mt-1">Version: vFinal_PRO_V3</p>

<!-- Live Price Display -->
<div class="mt-6 bg-black/40 p-3 rounded-lg border border-slate-800">
<span class="text-xs text-gray-400 block uppercase">Live BNB Price</span>
<span id="liveBNB" class="text-lg font-bold text-yellow-400">Loading...</span>
</div>

<button onclick="toggleSidebar()" class="mt-4 text-xs lg:hidden bg-gray-800 px-3 py-1 rounded w-full">Close Menu</button>
</div>

<!-- Logout Button -->
<button onclick="logout()" class="bg-red-500/20 hover:bg-red-500/40 text-red-400 text-sm py-2 px-4 rounded-lg font-bold transition">
Logout (Reload)
</button>
</aside>

<!-- MAIN CONTENT -->
<main class="flex-1 p-5">

<!-- Mobile Header (Visible on mobile only) -->
<div class="lg:hidden mb-4 flex justify-between items-center glass p-3 rounded-xl">
<span class="text-xl font-bold text-emerald-400">TRAVELX</span>
<button onclick="toggleSidebar()" class="bg-emerald-400 text-black px-3 py-1 rounded text-sm font-semibold">Menu</button>
</div>

<!-- CONNECT & STATUS -->
<div class="glass p-4 rounded-xl mb-4">
<div class="flex justify-between items-center flex-wrap gap-2">
<button id="connectBtn" onclick="connect()" class="bg-emerald-400 text-black px-4 py-2 rounded font-bold transition hover:bg-emerald-500">
Connect Wallet
</button>
<div id="walletDisplay" class="hidden text-emerald-400 text-sm font-mono bg-black/50 px-4 py-2 rounded-lg border border-emerald-500/20"></div>
</div>

<!-- Live Balance Board -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-4">
<div class="bg-slate-900/60 p-3 rounded-lg border border-slate-800">
<span class="text-xs text-gray-400 block">BNB Balance</span>
<span id="bnbBal" class="text-sm font-bold text-white">0.0000</span>
</div>
<div class="bg-slate-900/60 p-3 rounded-lg border border-slate-800">
<span class="text-xs text-gray-400 block">TVX Balance</span>
<span id="tvxBal" class="text-sm font-bold text-emerald-400">0.00</span>
</div>
<div class="bg-slate-900/60 p-3 rounded-lg border border-slate-800">
<span class="text-xs text-gray-400 block">Staking Profit</span>
<span id="stakeProfit" class="text-sm font-bold text-yellow-400">0.000000</span>
</div>
<div class="bg-slate-900/60 p-3 rounded-lg border border-slate-800">
<span class="text-xs text-gray-400 block">Referral Income</span>
<span id="income" class="text-sm font-bold text-blue-400">0.0000</span>
</div>
</div>
</div>

<!-- REFERRAL LINK -->
<div class="glass p-4 rounded-xl mb-4">
<label class="block text-xs uppercase tracking-wider text-gray-400 mb-2">Your Referral Link</label>
<div class="flex gap-2">
<input id="refLink" readonly class="w-full p-2 bg-slate-900 border border-slate-700 rounded text-emerald-400 text-sm" placeholder="Connect wallet to generate link"/>
<button onclick="copyRef()" class="bg-yellow-400 text-black px-4 py-1 rounded text-sm font-bold transition hover:bg-yellow-500 whitespace-nowrap">Copy Link</button>
</div>
</div>

<!-- BUY TOKENS -->
<div class="glass p-4 rounded-xl mb-4">
<label class="block text-xs uppercase tracking-wider text-gray-400 mb-2">Buy TVX Tokens (1 BNB = 10,000 TVX)</label>
<input id="bnbInput" type="number" step="any" oninput="updatePreview()" class="w-full p-2 bg-slate-900 border border-slate-700 rounded text-white" placeholder="Enter BNB amount"/>
<div id="previewTVX" class="mt-2 text-sm text-gray-400 font-medium">0.00 TVX</div>
<button onclick="buy()" class="bg-emerald-400 text-black px-4 py-2 mt-2 rounded font-bold transition hover:bg-emerald-500">Buy with MetaMask</button>
</div>

<!-- SWAP & ACTIONS -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="glass p-4 rounded-xl">
<label class="block text-xs uppercase tracking-wider text-gray-400 mb-2">Internal Swap</label>
<input id="swapInput" type="number" step="any" oninput="updateSwapPreview()" class="w-full p-2 bg-slate-900 border border-slate-700 rounded text-white" placeholder="Enter TVX amount"/>
<div id="swapPreviewBNB" class="mt-2 text-sm text-gray-400 font-medium">0.0000 BNB</div>
<button onclick="internalSwap()" class="bg-white text-black px-4 py-2 mt-2 rounded font-bold transition hover:bg-gray-200">Swap Tokens</button>
</div>

<div class="glass p-4 rounded-xl flex flex-col justify-center gap-3">
<button onclick="stakeTokens()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded transition text-sm">
Stake Tokens (Contract Required)
</button>
<button onclick="withdraw()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-2 px-4 rounded transition text-sm">
Withdraw Request (Backend Required)
</button>
</div>
</div>

</main>
</div>

<script>
/* ================= CONFIG ================= */
const RECEIVER = "0xdeAD000000000000000000000000000000000000";
const RATE = 10000;
const TVX_USD = 0.01;

let BNB_USD = 600;
let account, provider, signer;

/* ================= LOCAL DB ================= */
const db = () => JSON.parse(localStorage.getItem("tvx_vFinal_PRO_V3")) || {};
const save = d => localStorage.setItem("tvx_vFinal_PRO_V3", JSON.stringify(d));

/* ================= SIDEBAR ================= */
function toggleSidebar() {
    document.getElementById("sidebar")?.classList.toggle("sidebar-folded");
}

/* ================= PRICE ================= */
async function fetchPrice() {
    try {
        const res = await fetch("coingecko.com");
        const data = await res.json();

        if (data?.binancecoin?.usd) {
            BNB_USD = data.binancecoin.usd;
            const el = document.getElementById("liveBNB");
            if (el) el.innerText = "$" + BNB_USD.toFixed(2);
        }
    } catch {
        const el = document.getElementById("liveBNB");
        if (el) el.innerText = "$" + BNB_USD.toFixed(2);
    }
}

/* ================= CONNECT WALLET ================= */
async function connect() {
    if (!window.ethereum) return alert("MetaMask Required!");

    try {
        const accs = await window.ethereum.request({ method: "eth_requestAccounts" });
        account = accs[0].toLowerCase();

        provider = new ethers.providers.Web3Provider(window.ethereum);
        signer = provider.getSigner();

        let d = db();

        if (!d[account]) {
            const ref = new URLSearchParams(location.search).get("ref");

            d[account] = {
                sponsor: ref ? ref.toLowerCase() : null,
                tvx: 0,
                bnb: 0,
                active: false,
                stakeStart: 0,
                stakedTvx: 0,
                txHistory: []
            };

            save(d);
        }

        document.getElementById("connectBtn")?.classList.add("hidden");

        const walletDisplay = document.getElementById("walletDisplay");
        if (walletDisplay) {
            walletDisplay.classList.remove("hidden");
            walletDisplay.classList.add("flex");
            walletDisplay.innerText = account.slice(0,6)+"..."+account.slice(-4);
        }

        updateRefLink();
        await update();
        setInterval(update, 3000);

        alert("Wallet Connected Successfully");

    } catch (e) {
        console.error(e);
        alert("Wallet Connection Failed");
    }
}

/* ================= REF LINK ================= */
function updateRefLink() {
    if (!account) return;
    const el = document.getElementById("refLink");
    if (el) el.value = window.location.origin + "?ref=" + account;
}

// Fixed function structure error here
function copyRef() {
    const el = document.getElementById("refLink");
    if (!el || !el.value) return alert("Connect wallet first");
    navigator.clipboard.writeText(el.value);
    alert("Referral link copied!");
}

/* ================= PREVIEW ================= */
function updatePreview() {
    const bnb = parseFloat(document.getElementById("bnbInput")?.value) || 0;
    document.getElementById("previewTVX").innerText = (bnb * RATE).toFixed(2) + " TVX";
}

function updateSwapPreview() {
    const tvx = parseFloat(document.getElementById("swapInput")?.value) || 0;
    document.getElementById("swapPreviewBNB").innerText = (tvx / RATE).toFixed(4) + " BNB";
}

/* ================= UPDATE ================= */
async function update() {
    if (!account) return;

    const d = db();
    const u = d[account];
    if (!u) return;

    try {
        const bal = await provider.getBalance(account);
        document.getElementById("bnbBal").innerText =
            parseFloat(ethers.utils.formatEther(bal)).toFixed(4);
    } catch {}

    const reward = (u.stakedTvx || 0) * 0.001;

    document.getElementById("tvxBal").innerText = (u.tvx || 0).toFixed(2);
    document.getElementById("stakeProfit").innerText = reward.toFixed(6);
    document.getElementById("income").innerText = (u.bnb || 0).toFixed(4);
}

/* ================= BUY ================= */
async function buy() {
    if (!account) return alert("Connect wallet first");

    const bnbAmt = document.getElementById("bnbInput")?.value;
    if (!bnbAmt || bnbAmt <= 0) return alert("Enter a valid BNB amount");

    try {
        const tx = await signer.sendTransaction({
            to: RECEIVER,
            value: ethers.utils.parseEther(bnbAmt)
        });

        await tx.wait();

        const d = db();
        const tvxGot = bnbAmt * RATE;

        d[account].tvx += tvxGot;

        save(d);

        alert("Purchase Success!");
        await update();

    } catch (e) {
        console.error(e);
        alert("Transaction failed or rejected.");
    }
}

/* ================= SIMPLE ================= */
function stakeTokens(){ alert("Staking requires smart contract integration."); }
function internalSwap(){ alert("Swap requires smart contract integration."); }
function withdraw(){ alert("Withdraw requires backend system."); }
function logout(){ location.reload(); }

/* ================= INIT ================= */
fetchPrice();
setInterval(fetchPrice, 60000);

if (window.ethereum) {
    window.ethereum.on('accountsChanged', (accounts) => {
        if(accounts.length === 0) {
            location.reload();
        } else {
            connect();
        }
    });
    window.ethereum.on('chainChanged', () => location.reload());
}
</script>

</body>
</html>
