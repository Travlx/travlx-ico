<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelX ICO | Official Dashboard</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        body { background: #05070a; color: white; min-height: 100vh; font-family: sans-serif; display: flex; align-items: center; justify-content: center; }
        .glass-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); border-radius: 24px; width: 100%; max-width: 420px; padding: 40px; }
    </style>
</head>
<body>

    <!-- 1. Connect Screen (Visible by Default) -->
    <div id="loginScreen" class="text-center">
        <h1 class="text-4xl font-extrabold mb-4 tracking-tighter">TravelX <span class="text-blue-500">ICO</span></h1>
        <p class="text-gray-500 mb-8 text-sm uppercase tracking-widest">Connect your wallet to start</p>
        <button id="connectBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-10 py-4 rounded-full font-bold shadow-lg shadow-blue-500/20 transition-all active:scale-95">
            Connect Wallet
        </button>
    </div>

    <!-- 2. Dashboard Screen (Hidden by Default) -->
    <div id="userDashboard" class="hidden glass-card shadow-2xl">
        <div class="flex justify-between items-center mb-8 border-b border-white/5 pb-4">
            <span class="text-[10px] font-black uppercase tracking-[0.2em] text-gray-500">Member Portal</span>
            <button id="exitBtn" class="text-[10px] bg-red-500/10 text-red-500 border border-red-500/20 px-3 py-1 rounded-md hover:bg-red-500 hover:text-white">Exit</button>
        </div>

        <div class="space-y-6">
            <div>
                <p class="text-gray-500 text-[9px] uppercase mb-2 tracking-widest">Active Address</p>
                <p id="displayAddress" class="text-blue-400 font-mono text-[10px] break-all bg-blue-500/5 p-3 rounded-xl border border-blue-500/10"></p>
            </div>

            <div>
                <p class="text-gray-500 text-[9px] uppercase mb-1 tracking-widest">BNB Balance</p>
                <p id="displayBalance" class="text-3xl font-bold tracking-tighter">0.0000 BNB</p>
            </div>

            <div class="pt-6 border-t border-white/5">
                <input type="number" id="inputBNB" placeholder="0.0 BNB" class="w-full bg-black border border-gray-800 rounded-xl p-4 mb-4 text-white outline-none focus:border-blue-500">
                <button class="w-full bg-white text-black font-black py-4 rounded-xl hover:bg-gray-200 transition uppercase text-xs tracking-widest">Buy TRVX Tokens</button>
            </div>
        </div>
    </div>

    <script>
        async function connect() {
            if (window.ethereum) {
                try {
                    const provider = new ethers.BrowserProvider(window.ethereum);
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const address = accounts[0];

                    // Switch UI
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('userDashboard').classList.remove('hidden');

                    // Set Address
                    document.getElementById('displayAddress').innerText = address;

                    // Get Balance
                    const balanceRaw = await provider.getBalance(address);
                    const balanceEth = ethers.formatEther(balanceRaw);
                    document.getElementById('displayBalance').innerText = parseFloat(balanceEth).toFixed(4) + " BNB";

                } catch (error) {
                    console.error("Connection failed", error);
                }
            } else {
                alert("Please install MetaMask!");
            }
        }

        document.getElementById('connectBtn').onclick = connect;
        document.getElementById('exitBtn').onclick = () => window.location.reload();
    </script>
</body>
</html>
