<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelX Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0f19;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  padding:20px;
}

.container{
  width:100%;
  max-width:420px;
  background:#111827;
  border-radius:20px;
  padding:20px;
}

.logo{text-align:center;margin-bottom:15px;}
.logo h1{color:#00ff99;}

.box{
  background:rgba(255,255,255,0.05);
  padding:15px;
  border-radius:15px;
  margin-bottom:12px;
}

.label{font-size:12px;color:#aaa;}
.value{font-size:18px;font-weight:bold;margin-top:5px;word-break:break-all;}

input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  background:#0d1117;
  color:#fff;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  margin-top:10px;
}

.primary{background:#00ff99;color:#000;}
.blue{background:#2563eb;color:#fff;}

.small{font-size:12px;color:#00ff99;margin-top:5px;}
</style>
</head>

<body>

<div class="container">

  <div class="logo">
    <h1>TRAVELX</h1>
  </div>

  <div class="box">
    <div class="label">Wallet</div>
    <div class="value" id="wallet">Not Connected</div>
  </div>

  <div class="box">
    <div class="label">Referral Link</div>
    <input id="refLink" readonly>
    <button class="blue" onclick="copyRef()">Copy Link</button>
  </div>

  <div class="box">
    <div class="label">BNB Balance</div>
    <div class="value" id="bnb">0.0000</div>
  </div>

  <div class="box">
    <div class="label">TRVX Earned</div>
    <div class="value" id="earned">0.0000</div>
  </div>

  <div class="box">
    <div class="label">Buy TRVX</div>
    <input id="bnbInput" type="number" placeholder="Enter BNB">
    <div class="small">Receive: <span id="preview">0</span> TRVX</div>
    <button class="blue" onclick="buyTokens()">Buy Tokens</button>
  </div>

  <div class="box">
    <div class="label">Stake TRVX</div>
    <input id="stakeInput" type="number" placeholder="Enter Amount">
    <button class="primary" onclick="stakeTokens()">Stake</button>
  </div>

  <button class="primary" onclick="connectWallet()">Connect Wallet</button>

</div>

<script>

const CONTRACT_ADDRESS = "0xc7154D0B74d0804e1e637EBDB2d5dfb2F584AA81";
const RATE = 10000;

let provider, signer, user;
let interval = null;

/* LOADING */
function loading(msg){
  Swal.fire({
    title: msg,
    allowOutsideClick:false,
    didOpen: () => Swal.showLoading()
  });
}

/* CONNECT WALLET */
async function connectWallet(){

  if(!window.ethereum){
    return Swal.fire("Error","MetaMask Install করুন","error");
  }

  provider = new ethers.providers.Web3Provider(window.ethereum);
  const accounts = await provider.send("eth_requestAccounts",[]);
  user = accounts[0];
  signer = provider.getSigner();

  document.getElementById("wallet").innerText =
    user.slice(0,6)+"..."+user.slice(-4);

  document.getElementById("refLink").value =
    window.location.origin + "?ref=" + user;

  update();

  if(interval) clearInterval(interval);
  interval = setInterval(update, 10000);
}

/* COPY */
function copyRef(){
  navigator.clipboard.writeText(document.getElementById("refLink").value);
  Swal.fire("Copied","Referral link copied","success");
}

/* UPDATE */
async function update(){
  if(!user) return;

  try{
    const bal = await provider.getBalance(user);
    document.getElementById("bnb").innerText =
      Number(ethers.utils.formatEther(bal)).toFixed(4);

    const abi = ["function totalBNBEarned(address) view returns(uint256)"];
    const c = new ethers.Contract(CONTRACT_ADDRESS, abi, provider);

    const earned = await c.totalBNBEarned(user);

    document.getElementById("earned").innerText =
      Number(ethers.utils.formatEther(earned)).toFixed(4);

  }catch(e){}
}

/* PREVIEW */
document.getElementById("bnbInput").addEventListener("input", e=>{
  document.getElementById("preview").innerText =
    Number(e.target.value || 0) * RATE;
});

/* BUY */
async function buyTokens(){

  const val = Number(document.getElementById("bnbInput").value);
  if(val <= 0) return Swal.fire("Error","Invalid BNB","warning");

  try{

    loading("Buying Tokens...");

    const ref = new URLSearchParams(location.search).get("ref");

    const finalRef = ref ? ref : user;

    const c = new ethers.Contract(
      CONTRACT_ADDRESS,
      ["function buyTokens(address) payable"],
      signer
    );

    const tx = await c.buyTokens(finalRef,{
      value: ethers.utils.parseEther(val.toString())
    });

    await tx.wait();

    Swal.fire("Success","Purchased","success");
    update();

  }catch(e){
    Swal.fire("Error","Transaction Failed","error");
  }
}

/* STAKE */
async function stakeTokens(){

  const val = Number(document.getElementById("stakeInput").value);
  if(val <= 0) return Swal.fire("Error","Invalid amount","warning");

  try{

    loading("Staking...");

    const c = new ethers.Contract(
      CONTRACT_ADDRESS,
      ["function stake(uint256)"],
      signer
    );

    const tx = await c.stake(
      ethers.utils.parseEther(val.toString())
    );

    await tx.wait();

    Swal.fire("Success","Staked","success");
    update();

  }catch(e){
    Swal.fire("Error","Failed","error");
  }
}

</script>

</body>
</html>
