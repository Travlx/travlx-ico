<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TravelX ICO | User Portal</title>
    <!-- Stable Web3 Libraries -->
    <script src="https://cloudflare.com"></script>
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>
    <style>
        body { background-color: #05070a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { text-align: center; border: 1px solid #2d333b; padding: 40px 25px; border-radius: 28px; background: #0d1117; width: 100%; max-width: 360px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .btn { background-color: #238636; color: white; border: none; padding: 16px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; width: 100%; transition: 0.3s; margin-top: 10px; }
        .btn:hover { background-color: #2ea043; transform: translateY(-2px); }
        .btn-blue { background-color: #3b82f6; }
        #dashboard { display: none; text-align: left; }
        .info-card { background: #161b22; padding: 18px; border-radius: 14px; margin-bottom: 20px; border: 1px solid #30363d; }
        .label { color: #8b949e; font-size: 10px; text-transform: uppercase; font-weight: bold; display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #30363d; background: #010409; color: white; margin-bottom: 15px; outline: none; box-sizing: border-box; font-size: 16px; }
    </style>
</head>
<body>

    <div class="container">
        <div id="loginScreen">
            <h1 style="color: #58a6ff; font-size: 28px; margin-bottom: 10px;">TravelX ICO</h1>
            <p style="color: #8b949e; font-size: 14px; margin-bottom: 30px;">Connect Mobile or PC Wallet</p>
            <button id="connectBtn" onclick="onConnect()" class="btn">Connect Wallet</button>
        </div>

        <div id="dashboard">
            <h3 style="margin-top: 0; color: #f0f6fc; font-size: 18px; margin-bottom: 20px;">User Dashboard</h3>
            <div class="info-card">
                <span class="label">Wallet Address</span>
                <span id="userAddress" style="color: #58a6ff; font-family: monospace; font-size: 11px; word-break: break-all;"></span>
            </div>
            <div class="info-card">
                <span class="label">BNB Balance</span>
                <span id="userBalance" style="font-size: 20px; font-weight: bold;">0.000000 BNB</span>
            </div>
            <div style="padding-top: 5px;">
                <span class="label">Presale: 1 BNB = 10,000 TRVX</span>
                <input type="number" id="bnbInput" oninput="calculate()" placeholder="Amount (BNB)" step="0.01">
                <p style="font-size: 13px; color: #58a6ff; margin-bottom: 15px;">Receive: <span id="tokenOutput" style="font-weight: bold;">0</span> TRVX</p>
                <button onclick="buyTokens()" class="btn btn-blue">Buy TRVX Tokens</button>
            </div>
            <button onclick="disconnect()" style="background: none; border: none; color: #f85149; cursor: pointer; font-size: 11px; width: 100%; margin-top: 25px; text-decoration: underline;">Disconnect</button>
        </div>
    </div>

    <script>
        const myWallet = "0x68211153222bf054Decb13928870523a0C4264d4";
        const rate = 10000;
        let web3Modal, provider, signer;

        // Initialize Web3Modal with WalletConnect
        const providerOptions = {
            walletconnect: {
                package: WalletConnectProvider.default,
                options: {
                    rpc: { 56: "https://binance.org" }
                }
            }
        };

        web3Modal = new Web3Modal.default({
            cacheProvider: false, 
            providerOptions,
            theme: "dark"
        });

        function calculate() {
            const amount = document.getElementById('bnbInput').value;
            document.getElementById('tokenOutput').innerText = amount > 0 ? (amount * rate).toLocaleString() : 0;
        }

        async function onConnect() {
            try {
                // এটি পপ-আপ ওপেন করবে যেখানে মেটামাস্ক অপশন থাকবে
                const instance = await web3Modal.connect();
                provider = new ethers.providers.Web3Provider(instance);
                signer = provider.getSigner();
                const address = await signer.getAddress();

                const balance = await provider.getBalance(address);
                const balanceEth = ethers.utils.formatEther(balance);

                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                document.getElementById('userAddress').innerText = address;
                document.getElementById('userBalance').innerText = parseFloat(balanceEth).toFixed(6) + " BNB";

            } catch (e) {
                console.log("Modal closed");
            }
        }

        async function buyTokens() {
            const amount = document.getElementById('bnbInput').value;
            if (!amount || amount <= 0) return alert("Enter valid amount!");
            try {
                const tx = await signer.sendTransaction({
                    to: myWallet,
                    value: ethers.utils.parseEther(amount.toString())
                });
                alert("Sent! Hash: " + tx.hash);
            } catch (err) {
                alert("Transaction failed!");
            }
        }

        function disconnect() {
            window.location.reload();
        }
    </script>
</body>
</html>
