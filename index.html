<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelX User Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body { background:#060b14; color:white; }
.glass { background:rgba(13,19,32,0.95); border:1px solid rgba(255,255,255,0.05); }
.section { display:none; }
.active { display:block; }
.menu-active { background:#34d399 !important; color:black; }
</style>
</head>

<body class="flex font-sans">

<!-- SIDEBAR -->
<aside class="w-72 h-screen fixed left-0 top-0 bg-[#0b1220] border-r border-white/10 p-6">

<h1 class="text-2xl font-black text-emerald-400 mb-8">TRAVELX</h1>

<div class="space-y-3 text-sm font-bold">

<button onclick="show('dashboard',this)" class="menu w-full text-left p-3 rounded-xl bg-emerald-400 text-black">Dashboard</button>

<button onclick="show('buy',this)" class="menu w-full text-left p-3 rounded-xl bg-white/5">Buy TVX</button>

<button onclick="show('swap',this)" class="menu w-full text-left p-3 rounded-xl bg-white/5">Swap</button>

<button onclick="show('stake',this)" class="menu w-full text-left p-3 rounded-xl bg-white/5">Stake</button>

<button onclick="show('profit',this)" class="menu w-full text-left p-3 rounded-xl bg-white/5">Profit</button>

<button onclick="show('rank',this)" class="menu w-full text-left p-3 rounded-xl bg-white/5">Rank</button>

<button onclick="show('withdraw',this)" class="menu w-full text-left p-3 rounded-xl bg-white/5">Withdraw</button>

</div>

</aside>

<!-- MAIN -->
<main class="ml-72 w-full p-6 space-y-6">

<!-- DASHBOARD -->
<div id="dashboard" class="section active">
<h2 class="text-2xl font-black text-emerald-400">Dashboard</h2>

<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4">

<div class="glass p-4 rounded-xl">
<p>BNB</p><h2 id="bnb">0</h2>
</div>

<div class="glass p-4 rounded-xl">
<p>TVX</p><h2 id="tvx">0</h2>
</div>

<div class="glass p-4 rounded-xl">
<p>Staked</p><h2 id="staked">0</h2>
</div>

<div class="glass p-4 rounded-xl">
<p>Profit</p><h2 id="profit">0</h2>
</div>

</div>
</div>

<!-- BUY -->
<div id="buy" class="section">
<h2 class="text-xl font-black text-emerald-400">Buy TVX</h2>

<input id="buyInput" type="number" class="w-full p-3 bg-black/40 rounded-xl mt-4" placeholder="BNB">

<button onclick="buy()" class="mt-4 bg-yellow-500 text-black px-6 py-3 rounded-xl font-black">BUY</button>
</div>

<!-- SWAP -->
<div id="swap" class="section">
<h2 class="text-xl font-black text-yellow-400">Swap TVX</h2>

<input id="swapInput" type="number" class="w-full p-3 bg-black/40 rounded-xl mt-4" placeholder="TVX">

<button onclick="swap()" class="mt-4 bg-white text-black px-6 py-3 rounded-xl font-black">SWAP</button>
</div>

<!-- STAKE -->
<div id="stake" class="section">
<h2 class="text-xl font-black text-emerald-400">Stake (36% APY)</h2>

<input id="stakeInput" type="number" class="w-full p-3 bg-black/40 rounded-xl mt-4" placeholder="TVX">

<button onclick="stake()" class="mt-4 bg-emerald-400 text-black px-6 py-3 rounded-xl font-black">STAKE</button>
</div>

<!-- PROFIT -->
<div id="profitSection" class="section">
<h2 class="text-xl font-black text-yellow-400">Daily Profit</h2>

<p class="mt-3">Available Profit: <span id="profitVal">0</span> TVX</p>

<button onclick="claimProfit()" class="mt-4 bg-yellow-500 text-black px-6 py-3 rounded-xl font-black">CLAIM</button>

<button onclick="swapProfit()" class="mt-2 bg-white text-black px-6 py-3 rounded-xl font-black">SWAP TO BNB</button>
</div>

<!-- RANK -->
<div id="rank" class="section">
<h2 class="text-xl font-black text-emerald-400">Rank System</h2>

<p class="mt-2">Directs: <span id="directs">0</span></p>
<p>Team Stake: <span id="team">0</span></p>
<p class="text-yellow-400 mt-2">Rank: <span id="rankText">NONE</span></p>
</div>

<!-- WITHDRAW -->
<div id="withdraw" class="section">
<h2 class="text-xl font-black text-yellow-400">Withdraw</h2>

<button onclick="withdraw()" class="mt-4 bg-emerald-400 text-black px-6 py-3 rounded-xl font-black">
WITHDRAW
</button>
</div>

</main>

<!-- JAVASCRIPT -->
<script>

let user = {
    bnb: 0,
    tvx: 0,
    staked: 0,
    profit: 0,
    directs: 0,
    team: 0,
    rank: "NONE"
};

// NAV
function show(id, el) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');

    document.querySelectorAll('.menu').forEach(m => m.classList.remove('menu-active'));
    el.classList.add('menu-active');
}

// BUY
function buy() {
    let bnb = +buyInput.value;
    user.bnb += bnb;
    user.tvx += bnb * 1000;
    update();
}

// SWAP
function swap() {
    let tvx = +swapInput.value;
    user.tvx -= tvx;
    user.bnb += tvx * 0.001;
    update();
}

// STAKE
function stake() {
    let tvx = +stakeInput.value;
    user.tvx -= tvx;
    user.staked += tvx;

    user.profit += tvx * 0.001;
    update();
}

// CLAIM PROFIT
function claimProfit() {
    user.tvx += user.profit;
    user.profit = 0;
    update();
}

// SWAP PROFIT
function swapProfit() {
    user.bnb += user.profit * 0.001;
    user.profit = 0;
    update();
}

// WITHDRAW
function withdraw() {
    user.bnb += user.staked * 0.36;
    user.staked = 0;
    update();
}

// UPDATE UI
function update() {

    bnb.innerText = user.bnb.toFixed(2);
    tvx.innerText = user.tvx.toFixed(2);
    staked.innerText = user.staked.toFixed(2);
    profit.innerText = user.profit.toFixed(2);

    profitVal.innerText = user.profit.toFixed(2);

    directs.innerText = user.directs;
    team.innerText = user.team;

    let rank = "NONE";
    if (user.directs >= 5 && user.team >= 3) rank = "V1";
    if (user.directs >= 7 && user.team >= 15) rank = "V2";
    if (user.directs >= 10 && user.team >= 50) rank = "V3";

    rankText.innerText = rank;
    user.rank = rank;
}

</script>

</body>
</html>
