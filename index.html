<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelX | Final Dashboard</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background: #060b14; color: white; font-family: sans-serif; }
        .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; p: 20px; }
    </style>
</head>
<body class="p-5">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header -->
        <div class="flex justify-between items-center glass p-6">
            <h1 class="text-2xl font-black text-emerald-400">TRAVELX</h1>
            <button id="connectBtn" onclick="connect()" class="bg-emerald-500 text-black px-6 py-2 rounded-xl font-bold">Connect</button>
            <button id="logoutBtn" onclick="logout()" class="hidden bg-red-500 text-white px-6 py-2 rounded-xl font-bold">Logout</button>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="glass p-6 text-center">
                <p class="text-gray-400 text-xs uppercase">Your Balance</p>
                <h2 id="userBalance" class="text-2xl font-bold">0.0000 BNB</h2>
            </div>
            <div class="glass p-6 text-center">
                <p class="text-gray-400 text-xs uppercase">TVX Preview</p>
                <h2 id="previewTVX" class="text-2xl font-bold text-emerald-400">0 TVX</h2>
            </div>
            <div class="glass p-6 text-center">
                <button onclick="withdraw()" class="w-full bg-yellow-500 text-black py-3 rounded-xl font-black">WITHDRAW</button>
            </div>
        </div>

        <!-- Swap/Input Section -->
        <div class="glass p-8">
            <h3 class="mb-4 font-bold italic">Investment Preview</h3>
            <input id="bnbInput" oninput="updatePreview()" type="number" placeholder="Enter BNB Amount" class="w-full bg-black/50 border border-white/10 p-4 rounded-xl mb-4">
            
            <h3 class="mb-4 font-bold italic">Swap TVX to BNB</h3>
            <input id="swapInput" oninput="updateSwapPreview()" type="number" placeholder="Enter TVX Amount" class="w-full bg-black/50 border border-white/10 p-4 rounded-xl">
            <p class="mt-2 text-sm text-gray-400">You will get: <span id="swapPreviewBNB" class="text-emerald-400 font-mono">0.0000 BNB</span></p>
        </div>
    </div>

<script>
// --- ১. গ্লোবাল কনফিগারেশন ---
let account;
const BNB_USD = 400; 
const RATE = 1000;   // 1 BNB = 1000 TVX
const TVX_USD = 0.4; // 1 TVX = 0.4 USD

// --- ২. ডাটাবেস ফাংশন ---
function db() {
    let data = localStorage.getItem("travelx_db");
    return data ? JSON.parse(data) : {};
}

function save(data) {
    localStorage.setItem("travelx_db", JSON.stringify(data));
}

// --- ৩. কোর ফাংশনালিটি ---
async function connect() {
    if (window.ethereum) {
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        account = accounts[0];
        
        let d = db();
        if (!d[account]) {
            d[account] = { bnb: 0, active: true, txHistory: [], claimed: [] };
            save(d);
        }

        localStorage.setItem("connected", "true");
        update();
        
        document.getElementById("connectBtn").classList.add("hidden");
        document.getElementById("logoutBtn").classList.remove("hidden");
        Swal.fire("Connected", account.slice(0,6)+'...'+account.slice(-4), "success");
    } else {
        Swal.fire("Error", "Install MetaMask", "error");
    }
}

function update() {
    if (!account) return;
    let d = db();
    let u = d[account];
    document.getElementById("userBalance").innerText = u.bnb.toFixed(4) + " BNB";
}

function withdraw() {
    let d = db(); 
    let u = d[account];
    if (!account) return Swal.fire("Error", "Connect Wallet", "error");
    if (!u.active) return Swal.fire("Activation Required", "Activate card to withdraw.", "warning");
    if (u.bnb <= 0) return Swal.fire("Empty", "No balance to withdraw", "info");

    d[account].txHistory.unshift({ 
        type: 'WITHDRAW', 
        amt: '$'+((u.bnb * BNB_USD)).toFixed(2) 
    });
    u.bnb = 0; 
    save(d); 
    update(); 
    Swal.fire("Sent!", "Withdrawal processing...", "success");
}

function claimReward(rank, bonus) {
    let d = db();
    if (!account) return;
    if (!d[account].claimed) d[account].claimed = [];
    
    d[account].claimed.push(rank); 
    d[account].bnb += (bonus / BNB_USD);
    d[account].txHistory.unshift({ type: 'BONUS', amt: rank + ' Reward' });
    
    save(d); 
    update(); 
    Swal.fire("Congratulations!", `Achieving ${rank} earned you $${bonus}!`, "success");
}

function logout() { 
    localStorage.removeItem("connected"); 
    window.location.reload(); 
}

function updatePreview() { 
    let val = document.getElementById("bnbInput").value;
    document.getElementById("previewTVX").innerText = (val * RATE).toLocaleString() + " TVX"; 
}

function updateSwapPreview() {
    const tvx = document.getElementById("swapInput").value;
    document.getElementById("swapPreviewBNB").innerText = tvx ? ((tvx * TVX_USD) / BNB_USD).toFixed(6) + " BNB" : "0.0000 BNB";
}

// অটো-কানেক্ট লোড হলে
window.addEventListener('load', () => { 
    if (localStorage.getItem("connected") === "true") connect(); 
});
</script>
</body>
</html>
